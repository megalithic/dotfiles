"mru-spaces" = false
orientation = "bottom"
"show-process-indicators" = true
"show-recents" = false
"static-only" = true
tilesize = 60

[bootstrap.macos.defaults."com.apple.screencapture"]
# absolute literal path — defaults does not expand ~, and mise does not
# template values in [bootstrap.macos.defaults]
location = "/Users/seth/_screenshots"
type = "png"
"disable-shadow" = true

[bootstrap.macos.defaults."com.apple.LaunchServices"]
LSQuarantine = false

[bootstrap.macos.defaults."com.apple.desktopservices"]
DSDontWriteNetworkStores = true
DSDontWriteUSBStores = true

[bootstrap.macos.defaults."com.apple.print.PrintingPrefs"]
"Quit When Finished" = true

[bootstrap.macos.defaults."com.freron.MailMate"]
SoftwareUpdateChannel = "beta"
MmShowTips = "never"
MmCustomKeyBindingsEnabled = true
MmCustomKeyBindingsName = "megamate"
MmComposerInitialFocus = "alwaysTextView"
MmShowAttachmentsFirst = true
MmSingleMessageWindowClosesAfterMove = true
MmHeadersViewWebKitDefaultFontSize = 14
MmHeadersViewWebKitStandardFont = "Helvetica"
MmMessagesWebViewMinimumFontSize = 14
MmMessagesWebViewWebKitDefaultFixedFontSize = 14
MmMessagesWebViewWebKitDefaultFontSize = 14
MmMessagesWebViewWebKitMinimumFontSize = 14
MmMessagesWebViewWebKitStandardFont = "Helvetica"
MmMessagesOutlineOpenMessageOnDoubleClick = true
MmMessagesOutlineShowUnreadMessagesInBold = true
# App Shortcuts (@ Cmd, ~ Opt, $ Shift, ^ Ctrl). No key binding selector syncs all
# sources, so bind the menu item; Root of Thread moves off its default ⌃⌘R.
NSUserKeyEquivalents = { "All Sources" = "@^r", "Root of Thread" = "@~^r" }

[bootstrap.macos.defaults."com.mitchellh.ghostty"]
SUAutomaticallyUpdate = false
SUEnableAutomaticChecks = false
SUHasLaunchedBefore = true
SUSendProfileInfo = false

[bootstrap.macos.defaults."net.imput.helium"]
SUAutomaticallyUpdate = false
SUEnableAutomaticChecks = false
SUScheduledCheckInterval = 0
SUHasLaunchedBefore = true
SUSendProfileInfo = false

[bootstrap.macos.defaults."ch.protonmail.drive"]
SUAutomaticallyUpdate = false
SUEnableAutomaticChecks = false
SUScheduledCheckInterval = 0
SUHasLaunchedBefore = true
SUSendProfileInfo = false

[bootstrap.macos.defaults."com.brnbw.Tuna"]
ConfigSyncCustomFolderPath = "/Users/seth/.config/tuna"
ConfigSyncUsesCustomFolder = true

[bootstrap.macos.defaults."org.hammerspoon.Hammerspoon"]
MJConfigFile = "~/.config/hammerspoon/init.lua"

[bootstrap.macos.defaults."com.apple.SoftwareUpdate"]
AutomaticCheckEnabled = true
AutomaticDownload = 1
CriticalUpdateInstall = 1
ScheduleFrequency = 1

[bootstrap.macos.launchd.agents."com.megadots.llama-cpp"]
program = "~/.dotfiles/mise/scripts/llama-server-launchd"
run_at_load = true
keep_alive = true
stdout_path = "~/Library/Logs/llama-cpp/stdout.log"
stderr_path = "~/Library/Logs/llama-cpp/stderr.log"

# Swifties agents. avwatchd and notiwatchd run the stable ~/.local/bin copies
# their [tools.<alias>] postinstall writes: a pin bump needs only a restart.
# MicCheck and AeroPlay run their app bundles in place: a pin bump means
# updating the program path here, then applying launchd agents.
#
# avwatchd: compiled native/browser AV state daemon. avwatchweb reaches the
# same stable binary through Chrome native messaging; consumers subscribe to
# ~/.local/state/avwatchd/sock.
[bootstrap.macos.launchd.agents."io.swifties.avwatch"]
program = "~/.local/bin/avwatchd"
run_at_load = true
keep_alive = true
stdout_path = "/dev/null"
stderr_path = "~/Library/Logs/avwatchd.log"

# notiwatchd: compiled Notification Center watcher daemon. It reads rules from
# ~/.config/notiwatchd/config.json, records to
# ~/.local/share/notiwatchd/notifications.db, broadcasts NDJSON on
# ~/.local/state/notiwatchd/sock, and routes to bin/ntfy/exec/webhook sinks.
# The binary needs one-time Full Disk Access and Accessibility grants.
[bootstrap.macos.launchd.agents."io.swifties.notiwatch"]
program = "~/.local/bin/notiwatchd"
environment = { PATH = "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin" }
run_at_load = true
keep_alive = true
stdout_path = "~/.cache/notiwatchd-stdout.log"
stderr_path = "~/.cache/notiwatchd-stderr.log"

# miccheck: compiled menubar push-to-talk/push-to-mute app.
[bootstrap.macos.launchd.agents."io.swifties.miccheck"]
program = "~/.local/share/mise/installs/miccheckd/0.3.1/MicCheck.app/Contents/MacOS/miccheckd"
run_at_load = true
keep_alive = true
stdout_path = "~/.cache/miccheck-stdout.log"
stderr_path = "~/.cache/miccheck-stderr.log"

# AeroPlay: route one app's audio only to a selected AirPlay or CoreAudio output.
[bootstrap.macos.launchd.agents."io.swifties.aeroplay"]
program = "~/.local/share/mise/installs/aeroplay/0.3.1/AeroPlay.app/Contents/MacOS/aeroplayd"
run_at_load = true
keep_alive = false
stdout_path = "~/.cache/aeroplayd-stdout.log"
stderr_path = "~/.cache/aeroplayd-stderr.log"

# kanata daemon (dev.mise.org.kanata.daemon) and kanata-bar agents are
# written and loaded by mise/scripts/setup-kanata (post-tools hook), because
# bootstrap.sh always passes `--skip launchd`. This entry stays as the
# declarative owner for whenever `mise bootstrap launchd` runs manually —
# it generates the same dev.mise.-prefixed label kanata-setup writes.
# NOTE: brew services CANNOT own the kanata daemon: the formula service is
# require_root=true (fails without sudo) and runs the Cellar path, which
# churns the Input Monitoring TCC grant on every upgrade.

[bootstrap.macos.launchd.agents."com.kanata-bar.ui"]
program = "~/.dotfiles/mise/scripts/kanata-bar-launchd"
run_at_load = true
keep_alive = false
stdout_path = "/tmp/kanata-bar.log"
stderr_path = "/tmp/kanata-bar.err"

[bootstrap.hooks.pre-packages]
run = """
  if [ "$(uname)" = "Darwin" ]; then
    mise run brew
  fi
"""

[bootstrap.hooks.post-packages]
# REFS:
# 
# Example usages of post-packages to steup MacOS LaunchAgents "dynamically"
# - https://github.com/nicknisi/dotfiles/blob/main/config/mise/config.toml#L194C1-L231
run = [
  "[ -d /Applications/Espanso.app ] || HOMEBREW_NO_ASK=1 HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_ENV_HINTS=1 brew install --cask espanso",
  "[ -d /Applications/zoom.us.app ] || HOMEBREW_NO_ASK=1 HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_ENV_HINTS=1 brew install --cask zoom",
  "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/scripts/espanso-service",
  "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/scripts/setup-pam",
  "mise run setup:helium",
]

# Defaults don't take effect until the app restarts, and these two aren't
# `defaults` at all: an array value mise can't write, and a file flag.
[bootstrap.hooks.post-defaults]
run = """
  if [ "$(uname)" = "Darwin" ]; then
    chflags nohidden ~/Library
    for app in Safari Finder Dock SystemUIServer; do killall "$app" 2>/dev/null || true; done
  fi
"""

# Full machine bootstrap reaches this hook once after tool install. Scoped
# update tasks call their phases directly and do not run post-tools.
# [bootstrap.hooks.post-tools]
# run = [
#   "mise run setup:hk",
#   "mise run setup:kanata",
#   "mise run update:fnox",
# ]

[bootstrap.user]
login_shell = "/opt/homebrew/bin/zsh"

[tasks.install-homebrew]
description = "Install homebrew onto the system."
run = """
  if command -v brew >/dev/null 2>&1; then
    echo "homebrew already installed at $(brew --prefix)"
    exit 0
  fi
  /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
"""

[tasks.brew]
description = "Install or upgrade Brewfile packages that mise can't manage"
depends = ["install-homebrew"]
run = """
set -eu
export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
brew trust --tap FelixKratz/formulae leandrocp/lumis nikitabobko/homebrew-tap
brew bundle install --file "$HOME/.dotfiles/Brewfile" --upgrade
"""

[tasks.up]
alias = "dot"
description = "Update and converge this machine"
dir = "{{env.DOTFILES_DIR}}"
run = [
  '''
  if [ -n "$(git status --porcelain --untracked-files=normal)" ]; then
    printf 'WARNING: dotfiles Git status is dirty. Untracked files or unstaged changes may not take effect with this task. Review git status and git add any files you want included.\n' >&2
  fi
  ''',
  { task = "update:tools" },
  { task = "update:packages" },
  { task = "update:dotfiles" },
  { task = "update:system" },
  { task = "update:nvim" },
  { task = "update:fnox" },
  { task = "update:pi" },
  { task = "reload:hammerspoon" },
  # "mise run setup:hk",
]
raw = true

[tasks."update:tools"]
description = "Update mise, plugins, and declared tools"
dir = "{{env.DOTFILES_DIR}}"
run = [
  "mise self-update --yes",
  "mise plugins update --yes",
  "mise install --yes",
  "mise upgrade --yes",
]

[tasks."update:packages"]
description = "Apply and upgrade declared system packages"
run = '''
set -eu
export MISE_ENV="${MISE_ENV:-$(hostname -s)}"
mise bootstrap packages apply --yes
mise bootstrap packages upgrade --yes
'''

[tasks."update:dotfiles"]
description = "Apply declared dotfile targets without overwriting conflicts"
# Read config from the repo directory, not through ~/.config/mise: the apply
# may itself be converting that path. A config dir (not a pinned file) keeps
# the config.$MISE_ENV.toml host overlay.
run = '''
set -eu
export MISE_ENV="${MISE_ENV:-$(hostname -s)}"
export MISE_CONFIG_DIR="${DOTFILES_DIR:-$HOME/.dotfiles}/config/mise"
mise --verbose bootstrap dotfiles apply --yes
'''

[tasks."update:system"]
description = "Converge local daemons, LaunchAgents, and macOS defaults"
run = '''
set -eu
export MISE_ENV="${MISE_ENV:-$(hostname -s)}"
mise bootstrap macos launchd-agents apply --yes
mise bootstrap --only macos-defaults --yes
'''

[tasks."update:nvim"]
description = "Update Neovim plugins and treesitter parsers"
run = [
  '''nvim --headless "+Lazy! sync" +qa''',
  '''nvim --headless "+TSUpdateSync" +qa''',
]

[tasks."update:fnox"]
description = "Refresh fnox cache and generated secret artifacts"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/scripts/update-fnox"
raw = true

[tasks."update:pi"]
description = "Update Pi, tools, and extensions"
dir = "{{env.DOTFILES_DIR}}"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/scripts/update-pi"

[tasks."reload:hammerspoon"]
description = "Reload Hammerspoon"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/bin/hs-reload"

[tasks."sync:fantastical"]
description = "Manual Fantastical snapshot, verify, publish (WOLFHALL), or restore (restore requires --apply)"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/bin/fantastical-sync"

[tasks.doctor]
description = "Post-bootstrap health checks (bootstrap.sh runs this last)"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/scripts/check-system"

[tasks.clean]
description = "Clean package-manager caches and generated artifacts"
run = """
set -euo pipefail

# Host-specific mise config: without MISE_ENV, `mise prune` below would treat
# host-scoped tools (e.g. AirConnect) as unrequested and delete them.
export MISE_ENV="${MISE_ENV:-$(hostname -s)}"

printf 'Run cleanup? This deletes caches, unused mise tool versions, Docker artifacts, and node_modules under $HOME/code. [y/N] '
read -r confirm
case "$confirm" in
  [yY]) ;;
  *) echo "Cancelled."; exit 0 ;;
esac

echo "==> bootstrap packages"
mise bootstrap packages prune --manager brew --yes

echo "==> mise"
mise cache prune
mise prune

echo "==> npm"
npm cache verify
npx --yes npkill --directory "$HOME/code" --exclude-sensitive --delete-all -y

echo "==> mac-cleaner-cli"
echo "Leave browser categories unselected. mac-cleaner-cli has no non-interactive browser skip flag."
npx --yes mac-cleaner-cli

echo "==> Cargo"
if ! command -v cargo-cache >/dev/null; then
  cargo install cargo-cache
fi
cargo cache --autoclean

echo "==> Docker"
if command -v docker >/dev/null && docker info >/dev/null 2>&1; then
  docker system prune --all --force
  docker builder prune --all --force
else
  echo "Docker is not running; skipping."
fi
"""

[tasks."setup:hk"]
description = "Install global hk hooks for repositories with hk.pkl"
run = "hk install --global --mise"

[tasks."setup:yubikey"]
description = "Per-YubiKey (serial-safe): age identity + fnox recipient + encrypted OP_SERVICE_ACCOUNT_TOKEN (interactive; pass serial: mise run setup:yubikey -- <serial>)"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/scripts/setup-yubikey"
# raw: PIN/touch/token prompts on the terminal
raw = true

[tasks."setup:kanata"]
description = "Install/activate Karabiner VirtualHID glue and restart mise-managed kanata services"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/scripts/setup-kanata"
# raw: connect stdin/stdout/stderr directly — the task prompts for a sudo
# password; under mise's default captured stdio the prompt never reaches the
# terminal and the run hangs silently.
raw = true

# Declarative Helium profile setup (External Extensions with baked
# prodversion, NSUserKeyEquivalents, Sparkle kill switch, en-US dictionary).
# Also chained from the helium tool's postinstall, so it reruns on upgrades.
# sources/outputs skip it until the setup script or Helium version changes.
[tasks."setup:helium"]
description = "Seed Helium extensions, preferences, and dictionary"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/scripts/setup-helium"
sources = [
  "{{env.DOTFILES_DIR}}/mise/scripts/setup-helium",
  "/Applications/Helium.app/Contents/Info.plist",
]
outputs = { auto = true }

[tasks."setup:touchid-sudo"]
description = "Install /etc/pam.d/sudo_local with pam_tid (+ pam_reattach for tmux); replaces nix-darwin enableSudoTouchIdAuth"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/scripts/setup-pam"

[tasks."helium:1password-trust"]
description = "Check 1Password trusts /Applications/Helium.app; prints GUI Add Browser steps if not (setting is tamper-protected, not writable)"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/bin/helium-1password-trust"

# Global tasks: generate a small stub config (.config/mise.toml) in a
# project from config/mise/tmpls/<lang>/. Tasks, env, and scripts are NOT
# copied: the stub includes the template's tasks.toml and scripts execute
# from the dotfiles template's scripts/ dir, so template edits apply to
# every consuming repo immediately. Generation also syncs the project's
# .worktreeinclude copy-ignored allowlist for the wt v2 flow. Run from a
# project root: `mise run gen:shopify`, `mise run gen:elixir -- /path`.
# Template helper lives in repo bin/ (linked onto PATH).
[tasks."gen:elixir"]
description = "Generate the elixir mise stub at [target-dir]/.config/mise.toml (default: cwd); scripts run from dotfiles"
dir = "{{cwd}}"
run = "mise-tmpl-gen elixir"

[tasks."gen:shopify"]
description = "Generate the shopify mise stub at [target-dir]/.config/mise.toml (default: cwd); scripts run from dotfiles"
dir = "{{cwd}}"
run = "mise-tmpl-gen shopify"

# Global task: apply per-worktree DB/port isolation to a Phoenix project.
# Run from a project root: `mise run elixir-worktree-isolation` (dry-run)
# or `mise run elixir-worktree-isolation -- --apply` to write.
# Script lives in repo bin/ (linked onto PATH).
[tasks.elixir-worktree-isolation]
description = "Apply per-worktree DB/port isolation to Phoenix config/dev.exs and config/test.exs"
dir = "{{cwd}}"
run = "elixir-worktree-isolation"
