#:tombi schema.strict = false

# Useful mise-based dotfiles repos and patterns:
#
# REFS:
# https://github.com/kryota-dev/dotfiles - uses tart and macos vms to test mise bootstrap runs
# https://github.com/sedalu/dotfiles - auto-env based on machine name, not just arch/os; and container based install :mindblown:
# https://github.com/AllySummers/dotfiles - hk, pkl, usage releated stuff, too
# https://github.com/hashiiiii/dotfiles
# https://github.com/disrupted/dotfiles/blob/master/.config/mise/config.toml - tools i typically use
# https://github.com/JJGadgets/Biohazard/blob/main/.mise.toml - lots of aqua use
# https://github.com/disrupted/dotfiles/blob/master/.config/mise/config.toml - elixir related
# https://github.com/AxlAlm/neovim-setup/blob/master/mise/README.md - language mise configs (not tmpl, manual cp)
# https://github.com/mfilej/dotfiles/blob/main/README.md - perhaps a more simplified and less bespoke script version of bootstraping with mise (also an elixirist)
# https://github.com/leandrocp/dotfiles/tree/master/config/mise - well known elixirist that uses mise/pi/nvim/zed/etc

[settings]
experimental = true
auto_install = true
env_shell_expand = true
# quiet = true
# verbose = false
activate_aggressive = true
color_theme = "everforest"
system_packages.managers = ["brew", "brew-cask", "mas"]
idiomatic_version_file_enable_tools = ["node"]
# using a lockfile helps avoid the need for a GitHub token on first time install
# activate with `mise lock`
lockfile = true
pin = true
# supply chain security: only allow installing new versions of tools that have
# been released for at least 8 hours, to avoid 0-day supply chain attacks.
# Exclude some tools that are frequently updated and have a low risk profile.
minimum_release_age = "8h"
minimum_release_age_excludes = [
  "npm:@earendil-works/pi-coding-agent",
  "npm:@openai/codex",
  "claude-code",
  "erlang",
  "elixir",
]
dotfiles.root = "~/.dotfiles"
python.compile = false
pipx.uvx = true
task.monorepo_depth = 2
github.use_git_credentials = true
npm.package_manager = "aube"
cargo.binstall = true
status.show_env = true
status.show_tools = true

[deps.aube]
auto = true

[env]
DO_NOT_TRACK = "true"
ERL_AFLAGS = "-kernel shell_history enabled"
FLYCTL_HOME = "$HOME/.fly"
GH_TELEMETRY = "false"
KERL_BUILD_DOCS = "yes"
MIX_OS_DEPS_COMPILE_PARTITION_COUNT = "5"
RIPGREP_CONFIG_PATH = "$HOME/.config/ripgrep/rc"
HK_MISE = "1"
HK_HIDE_WHEN_DONE = "true"
MISE_EXPERIMENTAL = "1"
# GitHub API auth is inherited from `fnox activate` or `fnox exec`.
# Unauthenticated mise release lookups are limited to 60 requests/hour.
OP_COMMAND = "op"

DOTS = "{{env.HOME}}/.dotfiles"
DOTFILES_DIR = "{{env.HOME}}/.dotfiles"
CODE = "{{env.HOME}}/code"
XDG_CONFIG_HOME = "{{env.HOME}}/.config"
XDG_DATA_HOME = "{{env.HOME}}/.local/share"
XDG_STATE_HOME = "{{env.HOME}}/.local/state"
XDG_CACHE_HOME = "{{env.HOME}}/.cache"
PI_STATE_DIR = "{{env.HOME}}/.local/state/pi"
PI_CODING_AGENT_DIR = "{{env.HOME}}/.pi/agent"
TMUX_LAYOUTS = "{{env.HOME}}/.config/tmux/layouts"
TMUX_PLUGIN_MANAGER_PATH = "{{env.HOME}}/.local/share/tmux/plugins"
TMUX_PLUGINS_HOME = "{{env.HOME}}/.local/share/tmux/plugins"

# 1Password SSH agent (was nix environment.extraInit; ssh's IdentityAgent in
# the mise-owned ssh config points at the same socket)
SSH_AUTH_SOCK = "{{env.HOME}}/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock"

EDITOR = "nvim -O"
VISUAL = "nvim -O"
GIT_EDITOR = "nvim -O"
JJ_EDITOR = "nvim -O"
MANPAGER = "nvim +Man!"
# MANPAGER = "less -X"
PLUG_EDITOR = "zed://file/__FILE__:__LINE__"
ECTO_EDITOR = "zed __FILE__:__LINE__"
ELIXIR_EDITOR = "zed __FILE__:__LINE__"

_.path = [
  "/opt/homebrew/opt/coreutils/libexec/gnubin",
  "/opt/homebrew/opt/curl/bin",
  "/opt/homebrew/opt/gnupg/bin",
  "/opt/homebrew/opt/gnu-sed/libexec/gnubin",
  "/opt/homebrew/opt/grep/libexec/gnubin",
  "/opt/homebrew/opt/make/libexec/gnubin",
  "/opt/homebrew/opt/unzip/bin",
  "/opt/homebrew/opt/zip/bin",
  "/opt/homebrew/opt/openjdk/bin",
  "$HOME/.bin",
  "$HOME/.local/bin",
  "$HOME/.dotfiles/bin",
  "./bin",
  "./.local_scripts",
  "$HOME/.fly/bin",
  "$HOME/.cargo/bin",
  "/Applications/Postgres.app/Contents/Versions/latest/bin",
]
# Do not load secrets through mise-env-fnox or a PATH-resolved `_.source`.
# Either approach runs `fnox export` on every mise config load. Inside a
# `fnox exec` launcher such as Pi, that creates a second secret-resolution pass
# and blocks command startup. Secrets reach consumers through maintained paths:
#   interactive shells -> `fnox activate` in each shell config
#   non-shell Pi/capper -> `fnox exec` in each launcher

[shell_alias]
"...." = "cd ../../.."
"..." = "cd ../.."
".." = "cd .."
ls = "eza --all --group-directories-first --color=always --hyperlink=always"
l = "eza --all --long --color=always --color-scale=all --group-directories-first --sort=type --hyperlink=always --icons=always --octal-permissions"
ll = "eza -lahF --group-directories-first --color=always --icons=always --hyperlink=always"
la = "eza -lahF --group-directories-first --color=always --icons=always --hyperlink=always"
tree = "eza --tree --color=always --hyperlink=always"
rm = "trash -v"
q = "exit"
",q" = "exit"
":q" = "exit"
":Q" = "exit"
":e" = "nvim"
dns_reset = "dscacheutil -flushcache && killall -HUP mDNSResponder"
mega = "ftm mega"
tmux = "direnv exec / tmux"
copy = "pbcopy"
paste = "pbpaste"
cat = "bat"
pic = "pi -c"
pir = "pi -r"
up = "cd $HOME/.dotfiles && mise run up"

[dotfiles]
# "~/.config" = "~/.dotfiles/config"

# -- pi coding agent: managed subset of ~/.pi/agent; runtime state (sessions/,
#    npm/, auth.json, settings.json) stays unmanaged. settings.json is merged
#    by `mise run pi:update`, not linked. --
"~/.pi/agent/AGENTS.md" = "~/.dotfiles/config/pi-coding-agent/agent/AGENTS.md"
"~/.pi/agent/APPEND_SYSTEM.md" = "~/.dotfiles/config/pi-coding-agent/agent/SYSTEM.md"
"~/.pi/agent/keybindings.json" = "~/.dotfiles/config/pi-coding-agent/agent/keybindings.json"
"~/.pi/agent/models.json" = "~/.dotfiles/config/pi-coding-agent/agent/models.json"
"~/.pi/agent/mcp.json" = "~/.dotfiles/config/pi-coding-agent/agent/mcp.json"
"~/.pi/web-search.json" = "~/.dotfiles/config/pi-coding-agent/web-search.json"
"~/.pi/agent/web-search.json" = "~/.dotfiles/config/pi-coding-agent/web-search.json"
"~/.config/pi/web-search.json" = "~/.dotfiles/config/pi-coding-agent/web-search.json"
"~/.pi/agent/extensions" = { source = "~/.dotfiles/config/pi-coding-agent/agent/extensions", mode = "symlink-each" }
"~/.pi/agent/skills" = { source = "~/.dotfiles/config/pi-coding-agent/agent/skills", mode = "symlink-each" }
"~/.pi/agent/prompts" = { source = "~/.dotfiles/config/pi-coding-agent/agent/prompts", mode = "symlink-each" }
"~/.pi/agent/agents" = { source = "~/.dotfiles/config/pi-coding-agent/agent/agents", mode = "symlink-each" }
# Lat extension tools launch through this agent-local path; point it at mise's
# stable shim rather than the removed Devenv profile.
"~/.pi/agent/bin/lat" = "~/.local/share/mise/shims/lat"
"~/.local/bin/pi" = "~/.dotfiles/config/pi-coding-agent/bin/pi"
"~/.local/bin/p" = "~/.dotfiles/config/pi-coding-agent/bin/p"
"~/.local/bin/work-tickets" = "~/.dotfiles/config/pi-coding-agent/bin/work-tickets"
# "~/Library/Developer/Xcode/UserData/FontAndColorThemes/tokyo-night.xccolortheme" = ".config/xcode/tokyo-night.xccolortheme"
# Keep global config, host overlays, lockfile, and templates together.
"~/.config/mise" = "~/.dotfiles/config/mise"
# Host-specific mise config: mise merges config.$MISE_ENV.toml on top of
# config.toml. MISE_ENV = short hostname, exported by shell init (fish env.fish,
# bashrc, zshrc) and bootstrap.sh.
"~/.config/atuin/config.toml" = "~/.dotfiles/config/atuin/config.toml"
"~/.config/notiwatchd" = "~/.dotfiles/config/notiwatchd"
# fnox: ~/.config/fnox/config.toml is intentionally NOT linked here. `mise run
# fnox` generates it from config/fnox/shared.toml and atomically installs
# its age-encrypted cache. Secret-bearing artifacts stay outside the repo.
"~/.s3cfg" = "~/.local/share/fnox/generated/s3cfg"
"~/.config/fish" = "~/.dotfiles/config/fish"
"~/.profile" = "~/.dotfiles/config/bash/profile"
"~/.bashrc" = "~/.dotfiles/config/bash/bashrc"
"~/.bash_profile" = "~/.dotfiles/config/bash/bash_profile"
"~/.zshrc" = "~/.dotfiles/config/zsh/zshrc"
"~/.zprofile" = "~/.dotfiles/config/zsh/zprofile"
"~/.config/fzf" = "~/.dotfiles/config/fzf"
"~/.config/jj/config.toml" = "~/.dotfiles/config/jj/config.toml"
# worktrunk: per-file — approvals.toml{,.lock} in the same dir are mutable runtime state
"~/.config/worktrunk/config.toml" = "~/.dotfiles/config/worktrunk/config.toml"
"~/.config/surfingkeys/config.js" = "~/.dotfiles/config/surfingkeys/config.js"
"~/.config/ghostty" = "~/.dotfiles/config/ghostty"
"~/.config/hammerspoon" = "~/.dotfiles/config/hammerspoon"
"~/.config/tuna" = "~/.dotfiles/config/tuna"
"~/.config/kitty" = "~/.dotfiles/config/kitty"
"~/.config/nvim" = "~/.dotfiles/config/nvim"
"~/.config/tmux" = "~/.dotfiles/config/tmux"

# -- generated fragments → committed static files (replaces Home Manager Nix interpolation) --
"~/.local/share/hammerspoon/nix_path.lua" = "~/.dotfiles/mise/fragments/hammerspoon/nix_path.lua"
"~/.local/share/hammerspoon/fragments/shade-next.lua" = "~/.dotfiles/mise/fragments/hammerspoon/shade-next.lua"
"~/.local/share/fish/nix.fish" = "~/.dotfiles/mise/fragments/fish/nix.fish"
"~/.config/shade-next/config.toml" = "~/.dotfiles/config/shade-next/config.toml"

# -- kanata: individual .kbd files (parent dir has mutable state; active kanata.kbd is mutable) --
"~/.config/kanata/macbook.kbd" = "~/.dotfiles/config/kanata/macbook.kbd"
"~/.config/kanata/macbook-disabled.kbd" = "~/.dotfiles/config/kanata/macbook-disabled.kbd"
"~/.config/kanata/icons" = "~/.dotfiles/config/kanata/icons"

# -- SSH: individual files (directory holds mutable keys/known_hosts).
#    ~/.ssh/config is host-specific: mapped in hosts/*.toml to
#    config/ssh/config.<hostname>, each Include-ing shared.config. --
"~/.ssh/allowed_signers" = "~/.dotfiles/config/ssh/allowed_signers"
# 1Password SSH agent key selection (vault/item); GUI (cask) + CLI (formula)
# both come from brew via [bootstrap.packages], replacing nix-darwin's
# _1password module.
"~/.config/1Password/ssh/agent.toml" = "~/.dotfiles/config/1password/agent.toml"
# YubiKey age identity stub (non-secret; key material stays on the YubiKey).
# Written by `mise run setup:yubikey`; used by the fnox age provider.
"~/.config/fnox/yubikey-identity.txt" = "~/.dotfiles/config/fnox/yubikey-identity.txt"

# -- home-dir dotfiles: sources live in home/ (symlinked to ~/*) --
"~/.iex.exs" = "~/.dotfiles/home/iex.exs"

# -- espanso: app support path, not XDG config --
"~/Library/Application Support/espanso" = "~/.dotfiles/config/espanso"

# -- git: XDG-native; single merged config, ignore is git's default excludes path.
#    No ~/.gitconfig or ~/.gitignore in the mise world (HM-era split collapsed).
#    NOTE: while nix still owns ~/.gitconfig it wins per-key over the XDG file;
#    values are identical today — mirror edits until the HM git module is dropped. --
"~/.config/git/config" = "~/.dotfiles/config/git/config"
"~/.config/git/ignore" = "~/.dotfiles/config/git/ignore"
"~/.ignore" = "~/.dotfiles/config/git/tool-ignore"

# -- static tool configs (small, single-file configs previously Nix-store-backed) --
"~/.config/bat/config" = "~/.dotfiles/config/bat/config"
# bat theme/syntax referenced by config (--theme=everforest, ghostty map-syntax);
# run `bat cache --build` if these change
"~/.config/bat/themes/everforest.tmTheme" = "~/.dotfiles/config/bat/themes/everforest.tmTheme"
"~/.config/bat/syntaxes/ghostty.sublime-syntax" = "~/.dotfiles/config/bat/syntaxes/ghostty.sublime-syntax"
"~/.config/direnv/direnv.toml" = "~/.dotfiles/config/direnv/direnv.toml"
"~/.config/starship.toml" = "~/.dotfiles/config/starship/starship.toml"
"~/.config/karabiner/karabiner.json" = "~/.dotfiles/config/karabiner/karabiner.json"
"~/.config/eza/theme.yml" = "~/.dotfiles/config/eza/theme.yml"
"~/.config/ripgrep/rc" = "~/.dotfiles/config/ripgrep/rc"
"~/.config/ripgrep/ignore" = "~/.dotfiles/config/fd/ignore"
"~/.config/fd/ignore" = "~/.dotfiles/config/fd/ignore"

# Keep ~/bin as one directory symlink. Home Manager's megabookpro link resolves
# through its generation to the same source; symlink-each would follow it and
# overwrite source files with self-referential links.
"~/bin" = "~/.dotfiles/bin"

# -- symlink-each targets (existing mutable dirs, needs per-entry reconciliation) --
"~/.local/bin" = { source = "~/.dotfiles/bin", mode = "symlink-each" }

