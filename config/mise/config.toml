SUEnableAutomaticChecks = false
SUHasLaunchedBefore = true
SUSendProfileInfo = false

# Helium: Sparkle auto-update kill switch (updates come from the mise tool /
# install-app.sh path instead). Twin of nix/modules/system.nix
# CustomUserPreferences."net.imput.helium". setup:helium also writes these,
# since `mise run up` skips the macos-defaults step.
[bootstrap.macos.defaults."net.imput.helium"]
SUAutomaticallyUpdate = false
SUEnableAutomaticChecks = false
SUScheduledCheckInterval = 0
SUHasLaunchedBefore = true
SUSendProfileInfo = false

# Proton Drive: Sparkle auto-update kill switch (brew cask owns updates).
# 2026-08-11: a Sparkle update stuck mid-flight + the keepalive SMAppService
# agent respawn-looped Proton Drive every 10s for ~8.5 days (73,510 runs),
# churning kTCCServiceListenEvent arbitration in WindowServer -> systemwide
# keyboard stalls. Doc: pi docs workbookpro-keyboard-input-loss.md
[bootstrap.macos.defaults."ch.protonmail.drive"]
SUAutomaticallyUpdate = false
SUEnableAutomaticChecks = false
SUScheduledCheckInterval = 0
SUHasLaunchedBefore = true
SUSendProfileInfo = false

[bootstrap.macos.defaults."com.brnbw.Tuna"]
ConfigSyncCustomFolderPath = "/Users/seth/.config/tuna"
ConfigSyncUsesCustomFolder = true

[bootstrap.macos.defaults."org.hammerspoon.Hammerspoon"]
MJConfigFile = "~/.config/hammerspoon/init.lua"

[bootstrap.macos.defaults."com.apple.SoftwareUpdate"]
AutomaticCheckEnabled = true
AutomaticDownload = 1
CriticalUpdateInstall = 1
ScheduleFrequency = 1

[bootstrap.macos.launchd.agents."com.megadots.llama-cpp"]
program = "~/.dotfiles/mise/tasks/llama-server-launchd"
run_at_load = true
keep_alive = true
stdout_path = "~/Library/Logs/llama-cpp/stdout.log"
stderr_path = "~/Library/Logs/llama-cpp/stderr.log"

# nicknisi/sessions indexes transcripts on demand through its CLI and MCP server.
# No session-indexing launchd agent is needed.

# avwatchd: compiled native/browser AV state daemon. avwatchweb reaches the
# same stable binary through Chrome native messaging; consumers subscribe to
# ~/.local/state/avwatchd/sock.
[bootstrap.macos.launchd.agents."com.megadots.avwatchd"]
program = "~/.local/bin/avwatchd"
run_at_load = true
keep_alive = true
stdout_path = "/dev/null"
stderr_path = "~/Library/Logs/avwatchd.log"

# notiwatchd: compiled Notification Center watcher daemon. It reads rules from
# ~/.config/notiwatchd/config.json, records to
# ~/.local/share/notiwatchd/notifications.db, broadcasts NDJSON on
# ~/.local/state/notiwatchd/sock, and routes to bin/ntfy/exec/webhook sinks.
# The binary needs one-time Full Disk Access and Accessibility grants.
[bootstrap.macos.launchd.agents."com.megadots.notiwatchd"]
program = "~/.local/bin/notiwatchd"
environment = { PATH = "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin" }
run_at_load = true
keep_alive = true
stdout_path = "~/.cache/notiwatchd-stdout.log"
stderr_path = "~/.cache/notiwatchd-stderr.log"

# miccheck: compiled menubar push-to-talk/push-to-mute app.
[bootstrap.macos.launchd.agents."com.megadots.miccheck"]
program = "~/.local/bin/miccheckd"
run_at_load = true
keep_alive = true
stdout_path = "~/.cache/miccheck-stdout.log"
stderr_path = "~/.cache/miccheck-stderr.log"

# Spotlight exclusions only touch user-owned development directories, so a
# user LaunchAgent replaces the former root nix-darwin daemon.
[bootstrap.macos.launchd.agents."com.megadots.spotlight-exclude"]
program = "~/.dotfiles/mise/tasks/spotlight-exclude"
run_at_load = true
keep_alive = false
start_interval = 21600
stdout_path = "~/.cache/spotlight-exclude.log"
stderr_path = "~/.cache/spotlight-exclude.err.log"

# kanata daemon (dev.mise.org.kanata.daemon) and kanata-bar agents are
# written and loaded by mise/tasks/kanata-setup (post-tools hook), because
# bootstrap.sh always passes `--skip launchd`. This entry stays as the
# declarative owner for whenever `mise bootstrap launchd` runs manually —
# it generates the same dev.mise.-prefixed label kanata-setup writes.
# NOTE: brew services CANNOT own the kanata daemon: the formula service is
# require_root=true (fails without sudo) and runs the Cellar path, which
# churns the Input Monitoring TCC grant on every upgrade.

[bootstrap.macos.launchd.agents."com.kanata-bar.ui"]
program = "~/.dotfiles/mise/tasks/kanata-bar-launchd"
run_at_load = true
keep_alive = false
stdout_path = "/tmp/kanata-bar.log"
stderr_path = "/tmp/kanata-bar.err"

[bootstrap.hooks.post-packages]
# Casks kept on real Brew because their verified service/lifecycle path still
# differs from the direct mise backend:
# - espanso: real Brew installs the app/CLI before espanso-service converges its
#   LaunchAgent
# - zoom: cask source uses `on_arch_conditional`; keep the verified package hook
#   until a clean-machine direct-backend install is proven
# hooks: no template expansion, cwd = config root, [env] not applied
run = [
  # op CLI comes from [bootstrap.packages] brew:1password-cli — official
  # documented install; real signed binary works with the app's 'Integrate with
  # 1Password CLI' setting (mise shims break the socket handshake).
  "[ -d /Applications/Espanso.app ] || HOMEBREW_NO_ASK=1 HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_ENV_HINTS=1 brew install --cask espanso",
  "[ -d /Applications/zoom.us.app ] || HOMEBREW_NO_ASK=1 HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_ENV_HINTS=1 brew install --cask zoom",
  "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/tasks/espanso-service",
  "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/tasks/setup-touchid-sudo",
]

[bootstrap.hooks.post-defaults]
run = "killall Finder SystemUIServer Dock || true"

# Full machine bootstrap reaches this hook once after tool install. The scoped
# bootstrap apply/upgrade commands in `mise run up` do not run post-tools; up
# calls the fnox task once in its explicit update sequence instead.
[bootstrap.hooks.post-tools]
run = [
  "mise run setup:kanata",
  "mise run setup:miccheck",
  "mise run setup:notiwatchd",
  "mise run setup:avwatchd",
  "mise run fnox",
]

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

# -- Nerd Fonts: declare the font list here (mirrors nix fonts.packages in
#    nix/hosts/common.nix). Names are release asset stems from
#    https://github.com/ryanoasis/nerd-fonts/releases (<Name>.tar.xz).
#    Add/remove a font = edit the list; `mise run fonts:install` converges.
#    The postinstall hook below also runs it after any `mise install`;
#    sources/outputs make re-runs no-ops when nothing changed.
[vars]
nerd_fonts_version = "3.4.0"
nerd_fonts = "JetBrainsMono FiraCode Iosevka VictorMono FantasqueSansMono NerdFontsSymbolsOnly"

[tasks.doctor]
description = "Post-bootstrap health checks (bootstrap.sh runs this last)"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/tasks/doctor"

[tasks."sync:fantastical"]
description = "Manual Fantastical snapshot, verify, publish (WOLFHALL), or restore (restore requires --apply)"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/bin/fantastical-sync"

[tasks."fonts:install"]
description = "Install Nerd Fonts into ~/Library/Fonts"
run = "NERD_FONTS_VERSION={{vars.nerd_fonts_version}} ${DOTFILES_DIR:-$HOME/.dotfiles}/mise/hooks/install-fonts.sh {{vars.nerd_fonts}}"
sources = [
  "{{env.HOME}}/.dotfiles/config/mise/config.toml",
  "{{env.HOME}}/.dotfiles/mise/hooks/install-fonts.sh",
]
outputs = { auto = true }

[hooks]
postinstall = '''
# echo "Installed: $MISE_INSTALLED_TOOLS"

echo "Running postinstall hooks.."
mise run fonts:install
'''

# [tasks.up]
# description = "Idempotently update tools, packages, dotfile symlinks, and launchd agents"
# dir = "{{env.HOME}}/.dotfiles"
# run = [
#   "mise self-update --yes 2>/dev/null || true",
#   "mise bootstrap --only packages,dotfiles,macos-launchd-agents --yes",
#   "mise install --yes",
#   "mise upgrade --yes",
#   "mise run doctor",
# ]

# -- setup:* namespace: bootstrap/provisioning tasks. Old names kept as
#    aliases so existing docs/scripts/muscle memory keep working. --

[tasks.up]
alias = "dot"
description = "Update system packages, mise tools, nvim packages, pi, and more"
run = """
set -euo pipefail

# Host-specific mise config: guard against stale shells without MISE_ENV so
# child mise invocations see ~/.config/mise/config.$MISE_ENV.toml.
export MISE_ENV="${MISE_ENV:-$(hostname -s)}"

state_dir="${XDG_STATE_HOME:-$HOME/.local/state}/mise"
mkdir -p "$state_dir"
export MISE_LOG_FILE="$state_dir/up.log"
export MISE_LOG_FILE_LEVEL=debug
: > "$MISE_LOG_FILE"
chmod 600 "$MISE_LOG_FILE"

step() {
  printf '\\n==> %s\\n' "$1"
  shift
  "$@"
}

on_exit() {
  status=$?
  trap - EXIT
  if [ "$status" -ne 0 ]; then
    printf '\\nup failed (exit %s). mise debug log: %s\\n' "$status" "$MISE_LOG_FILE" >&2
  fi
  exit "$status"
}
trap on_exit EXIT

step "Update mise" mise self-update --yes
step "Update mise plugins" mise plugins update --yes
step "Upgrade mise tools" mise upgrade --bump --yes
step "Apply packages" mise bootstrap packages apply --yes
step "Apply dotfiles" mise --verbose bootstrap dotfiles apply --force --yes
step "Build miccheckd" mise run setup:miccheck
step "Build notiwatchd" mise run setup:notiwatchd
step "Set up avwatchd" mise run setup:avwatchd
step "Apply launchd agents" mise bootstrap launchd apply --yes
# Use top-level scoped bootstrap so pre-defaults/post-defaults hooks run.
step "Apply macOS defaults" mise bootstrap --only macos-defaults --yes
step "Upgrade packages" mise bootstrap packages upgrade --yes
step "Sync fnox" mise run fnox
step "Update Pi" mise run pi:update
step "Reload Hammerspoon" "$HOME/.dotfiles/bin/hs-reload" || echo "hs-reload failed (Hammerspoon not running?)"

# nvim --headless -c "lua vim.pack.update(nil, { force = true })" -c "quit"
"""

[tasks.clean]
description = "Clean package-manager caches and generated artifacts"
run = """
set -euo pipefail

# Host-specific mise config: without MISE_ENV, `mise prune` below would treat
# host-scoped tools (e.g. AirConnect) as unrequested and delete them.
export MISE_ENV="${MISE_ENV:-$(hostname -s)}"

printf 'Run cleanup? This deletes caches, unused mise tool versions, Docker artifacts, and node_modules under $HOME/code. [y/N] '
read -r confirm
case "$confirm" in
  [yY]) ;;
  *) echo "Cancelled."; exit 0 ;;
esac

echo "==> bootstrap packages"
mise bootstrap packages prune --manager brew --yes

echo "==> mise"
mise cache prune
mise prune

echo "==> npm"
npm cache verify
npx --yes npkill --directory "$HOME/code" --exclude-sensitive --delete-all -y

echo "==> mac-cleaner-cli"
echo "Leave browser categories unselected. mac-cleaner-cli has no non-interactive browser skip flag."
npx --yes mac-cleaner-cli

echo "==> Cargo"
if ! command -v cargo-cache >/dev/null; then
  cargo install cargo-cache
fi
cargo cache --autoclean

echo "==> Docker"
if command -v docker >/dev/null && docker info >/dev/null 2>&1; then
  docker system prune --all --force
  docker builder prune --all --force
else
  echo "Docker is not running; skipping."
fi
"""

[tasks.fnox]
description = "Idempotently converge fnox config, encrypted cache, daemon state, and generated artifacts"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/tasks/fnox"
# raw: 1Password may request biometric approval on the terminal
raw = true

[tasks."setup:yubikey"]
description = "Per-YubiKey (serial-safe): age identity + fnox recipient + encrypted OP_SERVICE_ACCOUNT_TOKEN (interactive; pass serial: mise run setup:yubikey -- <serial>)"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/tasks/yubikey-setup"
# raw: PIN/touch/token prompts on the terminal
raw = true

# [tasks."setup:op:signin"]
# alias = "op:signin"
# description = "Interactive gate: wait until the 1Password CLI (op) is signed in with app integration"
# run = "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/tasks/op-signin-gate"

[tasks."pi:update"]
description = "Update pi tools, settings, runtime packages, and extensions"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/tasks/pi-update"

[tasks."setup:pi"]
alias = "pi:setup"
description = "Compatibility alias for pi:update"
run = "mise run pi:update"

[tasks."setup:kanata"]
alias = "kanata:setup"
description = "Install/activate Karabiner VirtualHID glue and restart mise-managed kanata services"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/tasks/kanata-setup"
# raw: connect stdin/stdout/stderr directly — the task prompts for a sudo
# password; under mise's default captured stdio the prompt never reaches the
# terminal and the run hangs silently.
raw = true

[tasks."setup:miccheck"]
alias = "miccheck:setup"
description = "Build and sign miccheckd"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/lib/build-swift miccheck"
sources = [
  "{{env.DOTFILES_DIR}}/lib/build-swift",
  "{{env.DOTFILES_DIR}}/lib/miccheck.swift",
]
outputs = ["{{env.HOME}}/.local/bin/miccheckd"]

[tasks."setup:notiwatchd"]
alias = "notiwatchd:setup"
description = "Build and sign notiwatchd"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/lib/build-swift notiwatchd"
sources = [
  "{{env.DOTFILES_DIR}}/lib/build-swift",
  "{{env.DOTFILES_DIR}}/lib/notiwatchd.swift",
]
outputs = ["{{env.HOME}}/.local/bin/notiwatchd"]

[tasks."build:avwatchd"]
hide = true
description = "Build and sign avwatchd"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/lib/build-swift avwatchd"
sources = [
  "{{env.DOTFILES_DIR}}/lib/build-swift",
  "{{env.DOTFILES_DIR}}/lib/avwatchd.swift",
]
outputs = ["{{env.HOME}}/.local/bin/avwatchd"]

[tasks."setup:avwatchd"]
alias = "avwatchd:setup"
description = "Build avwatchd, install native messaging, and retire media-presenced"
depends = ["build:avwatchd"]
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/tasks/setup-avwatchd"

# Declarative Helium profile setup (External Extensions with baked
# prodversion, NSUserKeyEquivalents, Sparkle kill switch, en-US dictionary).
# Also chained from the helium tool's postinstall, so it reruns on upgrades.
[tasks."setup:helium"]
alias = "helium:setup"
description = "Seed Helium extensions (External Extensions JSONs), keyboard shortcuts, Sparkle-off defaults, and spellcheck dictionary"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/tasks/setup-helium"

# checker, not setup — stays outside the namespace
[tasks."setup:touchid-sudo"]
description = "Install /etc/pam.d/sudo_local with pam_tid (+ pam_reattach for tmux); replaces nix-darwin enableSudoTouchIdAuth"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/tasks/setup-touchid-sudo"

[tasks."helium:1password-trust"]
description = "Check 1Password trusts /Applications/Helium.app; prints GUI Add Browser steps if not (setting is tamper-protected, not writable)"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/bin/helium-1password-trust"

# Global tasks: copy project templates from config/mise/tmpls/ into a
# project's .config/ dir. Run from a project root: `mise run gen:shopify`,
# `mise run gen:elixir -- /path/to/project`, or `mise run gen:wt-elixir` for
# Worktrunk's .config/wt.toml. Template helper lives in repo bin/ (linked onto PATH).
# Duplicated in nix/home/common/programs/mise/default.nix globalConfig (nix twin).
[tasks."gen:elixir"]
description = "Copy the elixir mise template + scripts to [target-dir]/.config/ (default: cwd)"
dir = "{{cwd}}"
run = "mise-tmpl-gen elixir"

[tasks."gen:shopify"]
description = "Copy the shopify mise template + scripts to [target-dir]/.config/ (default: cwd)"
dir = "{{cwd}}"
run = "mise-tmpl-gen shopify"

[tasks."gen:wt-elixir"]
description = "Copy the elixir Worktrunk template + scripts to [target-dir]/.config/wt.toml (default: cwd)"
dir = "{{cwd}}"
run = "mise-tmpl-gen wt.elixir"

[tasks."gen:wt-shopify"]
description = "Copy the shopify Worktrunk template + scripts to [target-dir]/.config/wt.toml (default: cwd)"
dir = "{{cwd}}"
run = "mise-tmpl-gen wt.shopify"

# Global task: apply per-worktree DB/port isolation to a Phoenix project.
# Run from a project root: `mise run elixir-worktree-isolation` (dry-run)
# or `mise run elixir-worktree-isolation -- --apply` to write.
# Script lives in repo bin/ (linked onto PATH).
[tasks.elixir-worktree-isolation]
description = "Apply per-worktree DB/port isolation to Phoenix config/dev.exs and config/test.exs"
dir = "{{cwd}}"
run = "elixir-worktree-isolation"
