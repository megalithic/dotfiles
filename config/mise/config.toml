[dotfiles]
# Sources mirror their destinations: config/<path> -> ~/.config/<path> and
# home/<path> -> ~/<path>, each as a per-file link from a Git-indexed tree.
# `manifest = "git"` deploys only files in Git's index: untracked or ignored
# files (secrets, runtime state, fish_variables, mise conf.d/) never deploy.
# Targets become real directories holding per-file links, so unmanaged
# neighbours (fnox/config.toml, jj/repos, Pi sessions, SSH keys) stay in place.
# Apply with `mise run update:dotfiles`, never --force: through a directory
# symlink at a target, --force would replace repo source files with
# self-referential links.
#
# Exclude patterns: no "/" matches any path component; with "/" the pattern is
# anchored to the tree root (a leading "/" says so explicitly). Excluding a
# directory excludes everything under it.
"~/.config" = { source = "~/.dotfiles/config", mode = "symlink-each", manifest = "git", exclude = [
  # repo docs and parked files, not app config
  "AGENTS.md",
  "git/disabled",
  # lockfile sidecars: mise resolves them beside the symlinked lockfile's target
  "mise/.mise",
] }

"~" = { source = "~/.dotfiles/home", mode = "symlink-each", manifest = "git", exclude = [
  # host selectors: the host overlay links one of them to ~/.ssh/config
  ".ssh/config.workbookpro",
  ".ssh/config.megabookpro",
  # Pi support material that stays beside its config but is not deployed
  "/.pi/AGENTS.md",
  ".pi/scripts",
  ".pi/tests",
  ".pi/patches",
  ".pi/disabled",
  # underscore-prefixed Pi resources are disabled
  ".pi/agent/extensions/_*",
  ".pi/agent/skills/_*",
  ".pi/agent/prompts/_*",
  ".pi/agent/agents/_*",
] }

# Notes for paths inside ~/.config:
# - mise: host overlays config.$MISE_ENV.toml sit beside config.toml (MISE_ENV =
#   short hostname, exported by shell init and bootstrap.sh).
# - fnox: ~/.config/fnox/config.toml is generated by `mise run update:fnox`
#   from mise/templates/fnox/shared.toml; only the non-secret
#   yubikey-identity.txt stub is tracked. Secret-bearing artifacts stay outside Git.
# - git: ignore is git's default excludes path. A leftover Home Manager
#   ~/.gitconfig (megabookpro, until that host leaves Nix) wins per-key over
#   config/git/config.
# - bat: run `bat cache --build` after changing config/bat.
# - 1Password: ssh/agent.toml selects SSH agent keys by vault/item; it holds
#   metadata, not key material. GUI (cask) + CLI (formula) come from
#   [bootstrap.packages].

# Keep ~/bin as one directory symlink. A leftover Home Manager link on
# megabookpro resolves through its generation to the same source; symlink-each
# would follow it and overwrite source files with self-referential links.
"~/bin" = "~/.dotfiles/bin"
# Generated outside the repo by `mise run update:fnox` (render-s3cfg); the
# secret-bearing file never enters Git.
"~/.s3cfg" = "~/.local/share/fnox/generated/s3cfg"

