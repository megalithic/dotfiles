[tools.miccheckd]
version = "0.3.1"
os = ["macos"]
asset_pattern = "miccheckd-{{ version }}-macos26-arm64.zip"
bin_path = "MicCheck.app/Contents/MacOS"

[tools.notiwatchd]
version = "0.3.1"
os = ["macos"]
asset_pattern = "notiwatchd-{{ version }}-macos26-arm64.zip"
# TCC keys bare executables by path: copy to a stable path so grants survive
# version bumps. Runs only on install; the agent keeps the old binary until
# restarted.
postinstall = '''
set -eu
mkdir -p "$HOME/.local/bin"
cp "$MISE_TOOL_INSTALL_PATH/notiwatchd" "$HOME/.local/bin/.notiwatchd.tmp"
mv -f "$HOME/.local/bin/.notiwatchd.tmp" "$HOME/.local/bin/notiwatchd"
'''

[tools.avwatchd]
version = "0.3.1"
os = ["macos"]
asset_pattern = "avwatchd-{{ version }}-macos26-arm64.zip"
# Same stable-path copy as notiwatchd. avwatchweb is swapped in by rename so
# Helium never loads a half-copied extension.
postinstall = '''
set -eu
bin="$HOME/.local/bin" web="$HOME/.local/share/avwatchd/avwatchweb"
mkdir -p "$bin" "$(dirname "$web")"
cp "$MISE_TOOL_INSTALL_PATH/avwatchd" "$bin/.avwatchd.tmp"
rm -rf "$web.tmp" "$web.old"
ditto "$MISE_TOOL_INSTALL_PATH/avwatchweb" "$web.tmp"
mv -f "$bin/.avwatchd.tmp" "$bin/avwatchd"
if [ -e "$web" ]; then mv "$web" "$web.old"; fi
mv "$web.tmp" "$web"
rm -rf "$web.old"
'''

[tools.tmux]
version = "3.8"
os = ["macos"]
url = "https://github.com/tmux/tmux/archive/{{version}}.tar.gz"
strip_components = 1
bin_path = "bin"
postinstall = '''
set -eu
cd "${MISE_TOOL_INSTALL_PATH:?}"
export PATH="/opt/homebrew/opt/bison/bin:/opt/homebrew/bin:$PATH"
export PKG_CONFIG_PATH="/opt/homebrew/opt/libevent/lib/pkgconfig:/opt/homebrew/opt/ncurses/lib/pkgconfig:/opt/homebrew/opt/utf8proc/lib/pkgconfig:/opt/homebrew/opt/jemalloc/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
sh autogen.sh
./configure CC=clang --prefix="$MISE_TOOL_INSTALL_PATH" --enable-utf8proc --enable-jemalloc
make -j4
make install
./bin/tmux -V
'''

# postinstall chain: mise/scripts/install-app mounts/copies the DMG, then setup-helium
# re-bakes the Chromium prodversion into the External Extensions update URLs
# (mise equivalent of the nix module's eval-time readDir; goes stale on
# Chromium bumps otherwise) and reapplies defaults/dictionary.
# [tools."github:tidewave-ai/tidewave_app"]
# version = "latest"
# os = ["macos"]
# asset_pattern = "tidewave-app-aarch64.dmg"
# postinstall = "$DOTFILES_DIR/mise/scripts/install-app"

[tools."github:megalithic/helium-macos-releases"]
version = "latest"
os = ["macos"]
# Gotchas learned during the megabookpro cutover (2026-08):
# - If this tool is in MISE_DISABLE_TOOLS anywhere in the environment (old
#   shells, tmux server env), mise drops ALL tool options — asset_pattern and
#   postinstall vanish, autodetection runs, and .dmg assets are hard-excluded,
#   yielding "No matching asset found for platform macos-arm64" with the DMG
#   plainly listed. Check `mise tool <name>` shows Tool Options before blaming
#   the pattern; purge stale env with `tmux set-environment -gu MISE_DISABLE_TOOLS`.
# - mise 2026.8.5's github backend 404'd by prepending `v` to the release tag;
#   fixed by `mise self-update` (bootstrap.sh keeps the binary current).
# asset_pattern supports globs and {{version}} templating equally.
asset_pattern = "helium_{{version}}_arm64-macos.dmg"
postinstall = "$DOTFILES_DIR/mise/scripts/install-app && $DOTFILES_DIR/mise/scripts/setup-helium"

# Kanata Bar v1.1.10 publishes only generic `kanata-bar.app.zip` and `.dmg`
# assets. The ZIP is arm64-only, so keep the explicit URL and checksum until
# upstream publishes platform-qualified assets with checksum sidecars.
[tools."http:kanata-bar"]
version = "1.1.10"
checksum = "sha256:ba07e3caeb41d1b2a667e2c246cc3b0ef632a2d812ceeac0ce2eed9441d63b35"
os = ["macos"]
strip_components = 0
platforms.macos-arm64.url = "https://github.com/not-in-stock/kanata-bar/releases/download/v{{version}}/kanata-bar.app.zip"

