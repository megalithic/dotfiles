#:tombi schema.strict = false

[settings]
dotfiles.root = "~/.dotfiles"
experimental = true
auto_install = false
env_shell_expand = true
activate_aggressive = true
system_packages.managers = ["brew", "brew-cask", "mas"]
idiomatic_version_file_enable_tools = ["node"]
pin = true
minimum_release_age = "0s"
python.compile = false
pipx.uvx = true
task.monorepo_depth = 2
# Task sources/outputs freshness by content, not mtime: touches without edits
# (checkout, rebase, no-op reformat) no longer rerun sourced tasks.
# mise also hashes this file as a source of every task it defines, so any
# content edit here reruns all sourced tasks once.
task.source_freshness_hash_contents = true
# Never read or write lockfiles by default, so tracked or stray mise.lock files
# in other repos stay untouched. ~/.dotfiles/mise.toml turns them back on there,
# which also covers this config's lockfiles; tasks that change tools run there.
lockfile = false
github.use_git_credentials = true
npm.package_manager = "aube"
cargo.binstall = true
status.show_env = true
status.show_tools = true

[deps.aube]
auto = true

