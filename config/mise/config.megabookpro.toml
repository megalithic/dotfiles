# Host-specific mise config: megabookpro only.
# Linked to ~/.config/mise/config.megabookpro.toml by [dotfiles]; mise merges
# it on top of config.toml when MISE_ENV=megabookpro (exported from the short
# hostname in shell init and bootstrap.sh). workbookpro twin lives next door.

[dotfiles]
# Host-specific ~/.ssh/config; Include-s config/ssh/shared.config.
"~/.ssh/config" = "~/.dotfiles/config/ssh/config.megabookpro"

# AirConnect (AirPlay -> UPnP/Sonos bridge, https://github.com/philippe44/AirConnect).
# The release zip carries binaries for every platform; postinstall marks the
# macOS ones executable. No brew formula or nixpkgs package exists.
[tools."github:philippe44/AirConnect"]
version = "latest"
os = ["macos"]
asset_pattern = "AirConnect-{{version}}.zip"
postinstall = "find \"$MISE_TOOL_INSTALL_PATH\" -name '*-macos-*' -type f -exec chmod +x {} +"

# NOTE: the README's example LaunchAgent plist is not usable verbatim — it
# pairs LaunchOnlyOnce=true with KeepAlive=true, which contradict each other
# (LaunchOnlyOnce jobs cannot be relaunched). mise generates the plist from
# this entry instead; the wrapper passes -Z (mandatory under launchd: no TTY,
# interactive mode spins CPU) and the Sonos latency flag.
[bootstrap.macos.launchd.agents."com.megadots.airupnp"]
program = "~/.dotfiles/mise/tasks/airupnp-launchd"
run_at_load = true
keep_alive = true
stdout_path = "~/.cache/airupnp-stdout.log"
stderr_path = "~/.cache/airupnp-stderr.log"
