# Host-specific mise config: workbookpro only.
# Linked to ~/.config/mise/config.workbookpro.toml by [dotfiles]; mise merges
# it on top of config.toml when MISE_ENV=workbookpro (exported from the short
# hostname in shell init and bootstrap.sh).

[dotfiles]
# Host-specific ~/.ssh/config; Include-s config/ssh/shared.config.
"~/.ssh/config" = "~/.dotfiles/config/ssh/config.workbookpro"

[tools]
ansible = "latest"
gcloud = "latest"
opentofu = "latest"

[bootstrap.macos.launchd.agents."com.megadots.pi-control-web"]
program = "~/.dotfiles/mise/scripts/pi-control-web-launchd"
run_at_load = true
keep_alive = true
stdout_path = "~/Library/Logs/pi-control-web/stdout.log"
stderr_path = "~/Library/Logs/pi-control-web/stderr.log"

[tasks."setup:pi-control-web"]
description = "Create the private Pi control web token and log directory"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/scripts/setup-pi-control-web"
