# Host-specific mise config: workbookpro only.
# Linked to ~/.config/mise/config.workbookpro.toml by [dotfiles]; mise merges
# it on top of config.toml when MISE_ENV=workbookpro (exported from the short
# hostname in shell init and bootstrap.sh).

[dotfiles]
# Host-specific ~/.ssh/config; Include-s ~/.ssh/shared.config (home/ tree).
"~/.ssh/config" = "~/.dotfiles/home/.ssh/config.workbookpro"

[tools]
ansible = "latest"
gcloud = "latest"
opentofu = "latest"

[bootstrap.macos.launchd.agents."com.megadots.pi-control-web"]
program = "~/.dotfiles/mise/scripts/pi-control-web-launchd"
run_at_load = true
keep_alive = true
stdout_path = "~/Library/Logs/pi-control-web/stdout.log"
stderr_path = "~/Library/Logs/pi-control-web/stderr.log"

# The Ultimate hub (~/.dotfiles, Fleet surface) on 127.0.0.1:4749, always on.
# While a hub started in a Rex tab runs, the wrapper waits and takes over once
# it stops; the launchd hub reports no Rex tab status (no tty).
[bootstrap.macos.launchd.agents."com.megadots.ultimate-hub"]
program = "~/.dotfiles/mise/scripts/ultimate-hub-launchd"
run_at_load = true
keep_alive = true
# Directly in ~/Library/Logs: launchd creates the file but not a missing folder.
stdout_path = "~/Library/Logs/ultimate-hub.log"
stderr_path = "~/Library/Logs/ultimate-hub.log"

[tasks."setup:pi-control-web"]
description = "Create the private Pi control web token and log directory"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/scripts/setup-pi-control-web"
