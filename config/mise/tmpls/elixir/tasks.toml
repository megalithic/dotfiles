# tasks.toml — elixir template tasks, consumed by generated project stubs via
# `[task_config] includes`. Task names here are top-level (no [tasks.] prefix,
# the included-file form). Scripts execute from dotfiles, so editing this file
# or scripts/ updates every consuming repo and worktree immediately — nothing
# is copied. Project stubs (or a project mise.local.toml) can override any
# task by redefining its name.

# Worktree setup, in three steps you can also run alone (`mise run wt:db`
# after a dropped database). Each is safe to rerun: none drops or resets a
# database it did not just create.
["wt:setup"]
description = "Prepare this checkout for development: wt:init, wt:deps, wt:db"
# rwt new runs dev:setup in each new worktree's setup tab.
alias = ["dev:setup", "setup"]
run = [{ task = "wt:init" }, { task = "wt:deps" }, { task = "wt:db" }]

["wt:init"]
description = "Trust and install mise tools, bootstrap Pi, install Hex and rebar when missing"
run = 'bash "$HOME/.dotfiles/config/mise/tmpls/elixir/scripts/wt-init.sh"'

["wt:deps"]
description = "Fetch deps, set up assets, compile dev and test in parallel"
run = 'bash "$HOME/.dotfiles/config/mise/tmpls/elixir/scripts/wt-deps.sh"'

["wt:db"]
description = "Start postgres; create, migrate and seed this checkout's databases"
depends = ["start:db"]
run = 'bash "$HOME/.dotfiles/config/mise/tmpls/elixir/scripts/db-ensure.sh"'

[bootstrap]
description = "Bootstrap local agent tooling (.pi dir: AGENTS.md + mcp.json)"
depends = ["bootstrap:pi"]

["bootstrap:pi"]
description = "Generate project-local Pi guidance and the Pidewave URL in .pi/mcp.json"
run = 'bash "$HOME/.dotfiles/config/mise/tmpls/elixir/scripts/bootstrap-pi.sh"'

["setup:db"]
description = "Init shared postgres cluster in ./tmp/pg (idempotent)"
run = 'bash "$HOME/.dotfiles/config/mise/tmpls/elixir/scripts/setup-db.sh"'

["db:reset"]
description = "Explicitly reset dev and test databases (destructive)"
depends = ["start:db"]
run = 'bash "$HOME/.dotfiles/config/mise/tmpls/elixir/scripts/reset-db.sh"'

["db:drop-worktree"]
description = "Drop one worktree's databases from the shared postgres (rwt prune runs it): mise run db:drop-worktree <id>"
run = 'bash "$HOME/.dotfiles/config/mise/tmpls/elixir/scripts/db-worktrees.sh" drop'

["db:orphans"]
description = "List databases of worktrees that no longer exist, with sizes; --drop drops them"
run = 'bash "$HOME/.dotfiles/config/mise/tmpls/elixir/scripts/db-worktrees.sh" orphans'

["start:db"]
description = "Start shared postgres in background (log: ./tmp/pg/postgres.log)"
depends = ["setup:db"]
run = 'bash "$HOME/.dotfiles/config/mise/tmpls/elixir/scripts/start-db.sh"'

["start:server"]
description = "Start web server"
depends = ["start:db"]
# raw connects stdin/stdout/stderr straight to the terminal. Without it mise
# captures the task's stdio, so `iex -S mix phx.server` sees no TTY on stdin,
# hits EOF, and exits 0 immediately instead of staying foregrounded.
raw = true
run = "m s"

["dev:services"]
description = "Run local development services in the foreground"
# start:db reuses the shared per-repository cluster when healthy and starts or
# repairs it when absent; only the worktree-specific Phoenix server stays here.
# dev-services.sh titles the tmux window services-<port>, mirrors pane output
# to .local/log/services.log (the `logs` task reads it), then execs `m s`.
depends = ["start:db"]
raw = true
run = 'bash "$HOME/.dotfiles/config/mise/tmpls/elixir/scripts/dev-services.sh"'

[logs]
description = "Show the last services-window log output (.local/log/services.log), ANSI stripped"
shell = "bash -c"
run = '''
f=.local/log/services.log
if [ -f "$f" ]; then
  tail -n 500 "$f" | perl -pe 's/\e\[[0-9;?]*[ -\/]*[@-~]//g; s/\e\][^\a]*(?:\a|\e\\\\)//g; s/\r//g'
else
  echo "no services log yet: $f (open the services window or run mise run start:server)"
fi
'''

["logs:follow"]
description = "Follow the services-window log (.local/log/services.log), ANSI stripped"
shell = "bash -c"
run = '''
f=.local/log/services.log
mkdir -p "$(dirname "$f")"; touch "$f"
tail -n 100 -f "$f" | perl -pe 's/\e\[[0-9;?]*[ -\/]*[@-~]//g; s/\e\][^\a]*(?:\a|\e\\\\)//g; s/\r//g'
'''
