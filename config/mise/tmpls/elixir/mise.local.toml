# Stub generated to <repo>/.config/mise.toml by bin/mise-tmpl-gen.
# Behavior lives in dotfiles and is NOT copied: tasks come from
# tmpls/elixir/tasks.toml via [task_config] includes, repo-keyed env from
# tmpls/elixir/env.sh via _.source, and scripts run from tmpls/elixir/scripts/.
# Editing the template updates every consuming repo/worktree immediately.
# Only project-local overrides belong in this stub (or a sibling
# mise.local.toml): redefining a task name or env var here wins.

[env]
# Load local env files so `mise run` tasks (e.g. the tmux services window)
# get the same vars as a direnv/.envrc shell — secrets plus dev toggles like
# RX_METRICS_PORT=-1. Keep .env / .env.local out of git.
_.file = [
  { path = ".env", tools = true, redact = true },
  { path = ".env.local", tools = true, redact = true },
]
# Repo-keyed env (HOST, shared-postgres PG_ROOT/PGHOST/PGPORT/PG_LOG/PGDATA):
# identical from the main checkout or any worktree, so config-root cwd is fine.
_.source = "{{env.HOME}}/.dotfiles/config/mise/tmpls/elixir/env.sh"

# ── Worktree-sensitive vars stay HERE, {{ cwd }}-anchored ────────────────
# Worktrees nested under the main repo load BOTH .config/mise.toml stubs and
# the ancestor's evaluates first; `cwd` is the directory being entered, so
# these resolve against the right checkout. `_.source` cannot do this — mise
# runs it with cwd = config root, which would freeze the ancestor's values.

# Respects a pre-set GIT_WORKTREE, otherwise asks the local `wt` wrapper for
# the canonical "{repo-name}-{branch-slug}" id. Main repo checkout → empty
# (config/dev.exs treats nil/"" as no worktree). Absolute path: in sh/mise
# context plain `wt` resolves to the Worktrunk binary, not the wrapper.
GIT_WORKTREE = { default = """{{ exec(command='
cd "' ~ cwd ~ '" 2>/dev/null || true
w="$HOME/.dotfiles/bin/wt"; [ -x "$w" ] && "$w" id . 2>/dev/null || true
') }}""" }

# Phoenix port via dotfiles phx-port.sh: $PORT override, else a running beam
# for this checkout, else 4000 + :erlang.phash2(GIT_WORKTREE, 1000) cached in
# .local/cache/ (mirrors worktree_port_offset in config/dev.exs).
PHX_PORT = { default = "{{ exec(command='cd \"' ~ cwd ~ '\" 2>/dev/null; bash \"$HOME/.dotfiles/config/mise/tmpls/elixir/scripts/phx-port.sh\" 2>/dev/null || echo 4000') }}" }

[tools]
# Precompiled postgres from github.com/theseus-rs/postgresql-binaries
# (macOS arm64 + Linux + Windows, sha256-verified; majors 13–18 available).
# extract_all: unpack the whole distribution (bin/ lib/ share/ include/);
# bin_path: without it, PATH would point at the archive root instead of bin/.
"ubi:theseus-rs/postgresql-binaries" = { version = "18.4.0", extract_all = "true", bin_path = "bin" }
expert = "0.1.10"
jq = "latest" # bootstrap:pi merges tidewave into .pi/mcp.json

[task_config]
includes = ["{{env.HOME}}/.dotfiles/config/mise/tmpls/elixir/tasks.toml"]
