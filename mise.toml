# Project-local dev tooling for the dotfiles repo itself.
# Separate from the global config at config/mise/config.toml (machine tooling).

[settings]
# The global config sets lockfile = false; lockfiles apply only inside this
# repo (mise.lock here and config/mise/mise*.lock for the global tools).
lockfile = true

[tools]
# TS tooling (oxlint, oxfmt, Pi packages for tests) is pinned in package.json/bun.lock.
bun = "1.4.2"
# oxlint/oxfmt run on node; oxlint loads the .ts config with node's type stripping.
node = "26"
"npm:bats" = "latest"
python = "3.14.8"

[vars]
ts_files = "'home/.pi/**/*.{ts,mjs,js}' 'config/mise/tmpls/elixir/tests/**/*.ts'"

[tasks."deps:ts"]
description = "Install pinned TS tooling and Pi types from bun.lock"
# No sources/outputs caching: a no-op install is ~50ms and a stamp can't see a deleted node_modules.
run = "bun install --frozen-lockfile"

[tasks."lint:ts"]
description = "Oxlint + vendored anti-slop over dotfiles-managed TS/JS (pi extensions, skill scripts)"
depends = ["deps:ts"]
run = "node_modules/.bin/oxlint -c tools/oxlint/oxlint.config.ts home/.pi"

[tasks."fmt:ts"]
description = "Format dotfiles-managed TS/JS with oxfmt"
depends = ["deps:ts"]
run = "node_modules/.bin/oxfmt {{vars.ts_files}}"

[tasks."fmt:ts:check"]
description = "Check oxfmt formatting of dotfiles-managed TS/JS"
depends = ["deps:ts"]
run = "node_modules/.bin/oxfmt --check {{vars.ts_files}}"

[tasks."test:ts"]
description = "Run the Bun test suites for Pi extensions and the Elixir template"
depends = ["deps:ts"]
# The ./ prefix makes Bun treat these as paths; bare paths under .pi are filtered out.
run = "bun test ./home/.pi/tests ./config/mise/tmpls/elixir/tests"

[tasks."check:ts"]
description = "Lint, format check, and test dotfiles-managed TS"
depends = ["lint:ts", "fmt:ts:check", "test:ts"]
