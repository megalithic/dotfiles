; llama-server router presets (mise/scripts/llama-server-launchd).
; Each [section] is a model directory under ~/.local/share/llama.cpp/models
; (bin/llm-pull downloads them) and its Pi model ID in
; home/.pi/agent/models.json; keep ctx-size equal to Pi's contextWindow.
; Keys are llama-server flags without dashes. Relative paths resolve from
; ~/.local/share/llama.cpp, the router's working directory.
version = 1

; Shared by every model. One slot, so the whole context serves one request.
; An idle model sleeps after 10 minutes and frees its memory; the next request
; reloads it (a few seconds from the page cache).
[*]
parallel = 1
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true
sleep-idle-seconds = 600

; Quality: dense 27B, image input, 256K native context. MTP drafting 3
; tokens took decode from 15 to 32 tok/s on the M4 Max (2: 25, 4: 31).
[qwen3.8-27b]
ctx-size = 131072
model-draft = drafts/qwen3.8-27b/MTP/mtp-Qwen3.8-27B-Q4_0.gguf
spec-type = draft-mtp
spec-draft-n-max = 3
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0

; Fast agentic coder: 40B MoE with 2.5B active, text only.
[flint-40b]
ctx-size = 131072
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0

; Fast generalist: 26B MoE with 4B active, image input.
[gemma4-26b]
ctx-size = 131072
model-draft = drafts/gemma4-26b/mtp-gemma-4-26B-A4B-it.gguf
spec-type = draft-mtp
spec-draft-n-max = 3
temp = 1.0
top-p = 0.95
top-k = 64

[nomic-embed]
ctx-size = 2048
embeddings = true
pooling = mean
