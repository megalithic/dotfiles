# op signin (interactive gate) -> fnox render. (helium moved to [tools] as a
# github: backend tool when its releases repo went public — no token needed.)
[tasks.bootstrap]
run = [
  # "command -v pre-commit >/dev/null 2>&1 && pre-commit install --install-hooks || true",
  # "mise install fnox",
  # "mise run setup:op:signin",
  "mise run fnox:render",
]

[tasks.doctor]
description = "Post-bootstrap health checks (bootstrap.sh runs this last)"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/tasks/doctor"

[tasks."fonts:install"]
description = "Install Nerd Fonts into ~/Library/Fonts"
run = "NERD_FONTS_VERSION={{vars.nerd_fonts_version}} ${DOTFILES_DIR:-$HOME/.dotfiles}/mise/hooks/install-fonts.sh {{vars.nerd_fonts}}"
sources = ["{{env.HOME}}/.dotfiles/mise/hooks/install-fonts.sh"]
outputs = { auto = true }

[hooks]
postinstall = '''
# echo "Installed: $MISE_INSTALLED_TOOLS"

echo "Running postinstall hooks.."
mise run fonts:install
'''

