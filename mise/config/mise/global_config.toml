SUEnableAutomaticChecks = false
SUHasLaunchedBefore = true
SUSendProfileInfo = false

# Helium: Sparkle auto-update kill switch (updates come from the mise tool /
# install-app.sh path instead). Twin of modules/system.nix
# CustomUserPreferences."net.imput.helium". setup:helium also writes these,
# since `mise run up` skips the macos-defaults step.
[bootstrap.macos.defaults."net.imput.helium"]
SUAutomaticallyUpdate = false
SUEnableAutomaticChecks = false
SUScheduledCheckInterval = 0
SUHasLaunchedBefore = true
SUSendProfileInfo = false

# Proton Drive: Sparkle auto-update kill switch (brew cask owns updates).
# 2026-08-11: a Sparkle update stuck mid-flight + the keepalive SMAppService
# agent respawn-looped Proton Drive every 10s for ~8.5 days (73,510 runs),
# churning kTCCServiceListenEvent arbitration in WindowServer -> systemwide
# keyboard stalls. Doc: pi docs workbookpro-keyboard-input-loss.md
[bootstrap.macos.defaults."ch.protonmail.drive"]
SUAutomaticallyUpdate = false
SUEnableAutomaticChecks = false
SUScheduledCheckInterval = 0
SUHasLaunchedBefore = true
SUSendProfileInfo = false

[bootstrap.macos.defaults."org.hammerspoon.Hammerspoon"]
MJConfigFile = "~/.config/hammerspoon/init.lua"

[bootstrap.macos.defaults."com.apple.SoftwareUpdate"]
AutomaticCheckEnabled = true
AutomaticDownload = 1
CriticalUpdateInstall = 1
ScheduleFrequency = 1

[bootstrap.macos.launchd.agents."com.megadots.llama-cpp"]
program = "~/.dotfiles/mise/tasks/llama-server-launchd"
run_at_load = true
keep_alive = true
stdout_path = "~/Library/Logs/llama-cpp/stdout.log"
stderr_path = "~/Library/Logs/llama-cpp/stderr.log"

[bootstrap.macos.launchd.agents."com.megadots.sesame-session-indexer"]
program = "~/.dotfiles/mise/config/pi-coding-agent/scripts/sesame-session-indexer"
args = ["watch", "--interval", "30"]
run_at_load = true
keep_alive = true
stdout_path = "~/.cache/sesame-session-indexer.log"
stderr_path = "~/.cache/sesame-session-indexer.log"

[bootstrap.macos.launchd.agents."com.megadots.pi-session-indexer"]
program = "~/.dotfiles/mise/config/pi-coding-agent/scripts/pi-session-indexer"
run_at_load = true
start_interval = 7200
stdout_path = "~/.cache/pi-session-indexer.log"
stderr_path = "~/.cache/pi-session-indexer.log"

# media-presence: meeting/AV presence daemon (bin/media-presenced, single-file
# swift script, no build step). Defaults match the nix agent's args
# (--socket ~/.local/state/media-presence/sock --cdp-port 9223).
[bootstrap.macos.launchd.agents."com.megadots.media-presenced"]
program = "~/.dotfiles/bin/media-presenced"
run_at_load = true
keep_alive = true
stdout_path = "~/.cache/media-presence-stdout.log"
stderr_path = "~/.cache/media-presence-stderr.log"

# miccheck: menubar push-to-talk/push-to-mute app (bin/miccheck.swift).
# Wrapper checks the compiled binary exists (built by `mise run setup:miccheck`).
[bootstrap.macos.launchd.agents."com.megadots.miccheck"]
program = "~/.dotfiles/bin/miccheck-launchd"
run_at_load = true
keep_alive = true
stdout_path = "~/.cache/miccheck-stdout.log"
stderr_path = "~/.cache/miccheck-stderr.log"

[bootstrap.macos.launchd.agents."com.megadots.syncthing"]
program = "/opt/homebrew/opt/syncthing/bin/syncthing"
args = ["--no-browser", "--no-restart"]
run_at_load = true
keep_alive = true
stdout_path = "~/.cache/syncthing.log"
stderr_path = "~/.cache/syncthing.log"

# kanata daemon (dev.mise.org.kanata.daemon) and kanata-bar agents are
# written and loaded by mise/tasks/kanata-setup (post-tools hook), because
# bootstrap.sh always passes `--skip launchd`. This entry stays as the
# declarative owner for whenever `mise bootstrap launchd` runs manually —
# it generates the same dev.mise.-prefixed label kanata-setup writes.
# NOTE: brew services CANNOT own the kanata daemon: the formula service is
# require_root=true (fails without sudo) and runs the Cellar path, which
# churns the Input Monitoring TCC grant on every upgrade.

[bootstrap.macos.launchd.agents."com.kanata-bar.ui"]
program = "~/.dotfiles/mise/tasks/kanata-bar-launchd"
run_at_load = true
keep_alive = false
stdout_path = "/tmp/kanata-bar.log"
stderr_path = "/tmp/kanata-bar.err"

[bootstrap.hooks.post-packages]
# Casks mise's brew-cask backend can't handle, installed via real brew:
# - hammerspoon: ships `binary` artifacts (backend is app-bundle only)
# - raycast: extension-less DMG URL (releases.raycast.com/.../download?build=arm);
#   backend infers archive type from URL filename and only magic-sniffs zip,
#   so the DMG is treated as a raw binary and 'Raycast.app' is never found
# - zoom: cask source uses `on_arch_conditional` (livecheck), which the shim's
#   DSL surface rejects during whole-file eval; postflight then fails
# (helium is NOT here: it needs the GitHub token, which needs op signin +
#  fnox render — see [tasks.bootstrap] for the ordered chain)
# hooks: no template expansion, cwd = config root, [env] not applied
run = [
  # op CLI comes from [bootstrap.packages] brew:1password-cli — official
  # documented install; real signed binary works with the app's 'Integrate with
  # 1Password CLI' setting (mise shims break the socket handshake).
  "[ -d /Applications/Hammerspoon.app ] || HOMEBREW_NO_ASK=1 HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_ENV_HINTS=1 brew install --cask hammerspoon",
  "[ -d /Applications/Espanso.app ] || HOMEBREW_NO_ASK=1 HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_ENV_HINTS=1 brew install --cask espanso",
  "[ -d /Applications/Raycast.app ] || HOMEBREW_NO_ASK=1 HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_ENV_HINTS=1 brew install --cask raycast",
  "[ -d /Applications/zoom.us.app ] || HOMEBREW_NO_ASK=1 HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_ENV_HINTS=1 brew install --cask zoom",
  "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/tasks/espanso-service",
  "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/tasks/setup-touchid-sudo",
]

[bootstrap.hooks.post-defaults]
run = "killall Finder SystemUIServer Dock || true"

[bootstrap.hooks.post-tools]
run = ["mise run setup:kanata", "mise run fnox:render"]

[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

# -- Nerd Fonts: declare the font list here (mirrors nix fonts.packages in
#    hosts/common.nix). Names are release asset stems from
#    https://github.com/ryanoasis/nerd-fonts/releases (<Name>.tar.xz).
#    Add/remove a font = edit the list; `mise run fonts:install` converges.
#    The postinstall hook below also runs it after any `mise install`;
#    sources/outputs make re-runs no-ops when nothing changed.
[vars]
nerd_fonts_version = "3.4.0"
nerd_fonts = "JetBrainsMono FiraCode Iosevka VictorMono FantasqueSansMono NerdFontsSymbolsOnly"

