# -- setup:* namespace: bootstrap/provisioning tasks. Old names kept as
#    aliases so existing docs/scripts/muscle memory keep working. --

[tasks.up]
alias = "dot"
description = "Update system packages, mise tools, nvim packages, pi, and more"
run = """
set -euo pipefail

mise self-update --yes
mise plugins update --yes
mise upgrade --bump --yes
mise bootstrap packages apply --yes
mise bootstrap dotfiles apply --force --yes
mise bootstrap launchd apply --yes
mise bootstrap macos-defaults apply --yes
mise bootstrap packages upgrade --yes
mise run fnox:render
mise run pi:update
"$HOME/.dotfiles/bin/hs-reload" || echo "hs-reload failed (Hammerspoon not running?)"

# nvim --headless -c "lua vim.pack.update(nil, { force = true })" -c "quit"
"""

[tasks.clean]
description = "Clean package-manager caches and generated artifacts"
run = """
set -euo pipefail

printf 'Run cleanup? This deletes caches, unused mise tool versions, Docker artifacts, and node_modules under $HOME/code. [y/N] '
read -r confirm
case "$confirm" in
  [yY]) ;;
  *) echo "Cancelled."; exit 0 ;;
esac

echo "==> bootstrap packages"
mise bootstrap packages prune --manager brew --yes

echo "==> mise"
mise cache prune
mise prune

echo "==> npm"
npm cache verify
npx --yes npkill --directory "$HOME/code" --exclude-sensitive --delete-all -y

echo "==> mac-cleaner-cli"
echo "Leave browser categories unselected. mac-cleaner-cli has no non-interactive browser skip flag."
npx --yes mac-cleaner-cli

echo "==> Cargo"
if ! command -v cargo-cache >/dev/null; then
  cargo install cargo-cache
fi
cargo cache --autoclean

echo "==> Docker"
if command -v docker >/dev/null && docker info >/dev/null 2>&1; then
  docker system prune --all --force
  docker builder prune --all --force
else
  echo "Docker is not running; skipping."
fi
"""

[tasks."setup:fnox"]
alias = "fnox:setup"
description = "One-time: restore fnox age key from 1Password and sync the local age cache (interactive)"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/tasks/fnox-setup"
# raw: op auth gate prompts on the terminal
raw = true

[tasks."setup:yubikey"]
description = "One-time (per YubiKey/token rotation): age identity on YubiKey + encrypted OP_SERVICE_ACCOUNT_TOKEN for fnox (interactive)"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/tasks/yubikey-setup"
# raw: PIN/touch/token prompts on the terminal
raw = true

[tasks."setup:fnox:render"]
alias = "fnox:render"
description = "Render fnox file-shaped secrets (env-vars.sh) to ~/.config/fnox/secrets"
run = "${DOTFILES_DIR:-$HOME/.dotfiles}/mise/tasks/fnox-render-secrets"
#
