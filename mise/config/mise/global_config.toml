#:tombi schema.strict = false

# Useful mise-based dotfiles repos and patterns:
#
# REFS:
# https://github.com/kryota-dev/dotfiles - uses tart and macos vms to test mise bootstrap runs
# https://github.com/sedalu/dotfiles - auto-env based on machine name, not just arch/os; and container based install :mindblown:
# https://github.com/AllySummers/dotfiles - hk, pkl, usage releated stuff, too
# https://github.com/hashiiiii/dotfiles
# https://github.com/disrupted/dotfiles/blob/master/.config/mise/config.toml - tools i typically use
# https://github.com/JJGadgets/Biohazard/blob/main/.mise.toml - lots of aqua use
# https://github.com/disrupted/dotfiles/blob/master/.config/mise/config.toml - elixir related
# https://github.com/AxlAlm/neovim-setup/blob/master/mise/README.md - language mise configs (not tmpl, manual cp)
# https://github.com/mfilej/dotfiles/blob/main/README.md - perhaps a more simplified and less bespoke script version of bootstraping with mise (also an elixirist)
# https://github.com/leandrocp/dotfiles/tree/master/config/mise - well known elixirist that uses mise/pi/nvim/zed/etc

[settings]
experimental = true
auto_install = true
env_shell_expand = true
# quiet = true
# verbose = false
activate_aggressive = true
color_theme = "everforest"
system_packages.managers = ["brew", "brew-cask", "mas"]
idiomatic_version_file_enable_tools = ["node"]
# using a lockfile helps avoid the need for a GitHub token on first time install
# activate with `mise lock`
lockfile = true
pin = true
# supply chain security: only allow installing new versions of tools that have
# been released for at least 24 hours, to avoid 0-day supply chain attacks.
# Exclude some tools that are frequently updated and have a low risk profile.
minimum_release_age = "8h"
minimum_release_age_excludes = [
  "npm:@earendil-works/pi-coding-agent",
  "npm:@openai/codex",
  "claude-code",
  "erlang",
  "elixir",
]
dotfiles.root = "~/.dotfiles"
python.compile = false
pipx.uvx = true
task.monorepo_depth = 2
github.use_git_credentials = true
npm.package_manager = "aube"
cargo.binstall = true
status.show_env = true
status.show_tools = true

[deps.aube]
auto = true

[env]
DO_NOT_TRACK = "true"
ERL_AFLAGS = "-kernel shell_history enabled"
FLYCTL_HOME = "$HOME/.fly"
GH_TELEMETRY = "false"
KERL_BUILD_DOCS = "yes"
MIX_OS_DEPS_COMPILE_PARTITION_COUNT = "5"
# RIPGREP_CONFIG_PATH = "$HOME/.config/ripgrep/ripgreprc"
HK_MISE = "1"
HK_HIDE_WHEN_DONE = "true"
MISE_EXPERIMENTAL = "1"
HOMEBREW_GITHUB_API_TOKEN = '{{ exec(command="if [ -f ~/.config/fnox/secrets/env-vars.sh ]; then . ~/.config/fnox/secrets/env-vars.sh; elif [ -f ~/.config/opnix/secrets/env-vars.sh ]; then . ~/.config/opnix/secrets/env-vars.sh; fi; printf %s $HOMEBREW_GITHUB_API_TOKEN") }}'
# mise's own GitHub API auth (release/tag lookups for github:/aqua: backends
# and `mise lock`). Unauthenticated is 60 req/hr and stalls in 429 retries.
# mise reads MISE_GITHUB_TOKEN > GITHUB_API_TOKEN > GITHUB_TOKEN.
GITHUB_TOKEN = '{{ exec(command="if [ -f ~/.config/fnox/secrets/env-vars.sh ]; then . ~/.config/fnox/secrets/env-vars.sh; elif [ -f ~/.config/opnix/secrets/env-vars.sh ]; then . ~/.config/opnix/secrets/env-vars.sh; fi; printf %s $GITHUB_TOKEN") }}'
OP_COMMAND = "op"

DOTS = "{{env.HOME}}/.dotfiles"
DOTFILES_DIR = "{{env.HOME}}/.dotfiles"
CODE = "{{env.HOME}}/code"
XDG_CONFIG_HOME = "{{env.HOME}}/.config"
XDG_DATA_HOME = "{{env.HOME}}/.local/share"
XDG_STATE_HOME = "{{env.HOME}}/.local/state"
XDG_CACHE_HOME = "{{env.HOME}}/.cache"
PI_STATE_DIR = "{{env.HOME}}/.local/state/pi"
PI_CODING_AGENT_DIR = "{{env.HOME}}/.pi/agent"
STCONFDIR = "{{env.HOME}}/.config/syncthing"

EDITOR = "nvim -O"
VISUAL = "nvim -O"
GIT_EDITOR = "nvim -O"
JJ_EDITOR = "nvim -O"
MANPAGER = "nvim +Man!"
# MANPAGER = "less -X"
PLUG_EDITOR = "zed://file/__FILE__:__LINE__"
ECTO_EDITOR = "zed __FILE__:__LINE__"
ELIXIR_EDITOR = "zed __FILE__:__LINE__"

_.path = [
  "/opt/homebrew/opt/coreutils/libexec/gnubin",
  "/opt/homebrew/opt/gnupg/bin",
  "/opt/homebrew/opt/gnu-sed/libexec/gnubin",
  "/opt/homebrew/opt/grep/libexec/gnubin",
  "/opt/homebrew/opt/openjdk/bin",
  "$HOME/.bin",
  "$HOME/.local/bin",
  "$HOME/.dotfiles/bin",
  "./bin",
  "./.local_scripts",
  "$HOME/.fly/bin",
  "$HOME/.cargo/bin",
  "/Applications/Postgres.app/Contents/Versions/latest/bin",
]
_.fnox-env = { tools = true }
# Secrets chain: fnox when configured, else opnix (megabookpro during the
# nix -> mise migration). Script guard avoids per-shell fnox failures on
# hosts without ~/.config/fnox.
_.source = "{{env.HOME}}/.dotfiles/mise/fragments/env-secrets.sh"

[shell_alias]
"...." = "cd ../../.."
"..." = "cd ../.."
".." = "cd .."
ls = "eza --all --group-directories-first --color=always --hyperlink=always"
l = "eza --all --long --color=always --color-scale=all --group-directories-first --sort=type --hyperlink=always --icons=always --octal-permissions"
ll = "eza -lahF --group-directories-first --color=always --icons=always --hyperlink=always"
la = "eza -lahF --group-directories-first --color=always --icons=always --hyperlink=always"
tree = "eza --tree --color=always"
rm = "trash -v"
q = "exit"
",q" = "exit"
":q" = "exit"
":Q" = "exit"
":e" = "nvim"
dns_reset = "dscacheutil -flushcache && killall -HUP mDNSResponder"
mega = "ftm mega"
copy = "pbcopy"
paste = "pbpaste"
cat = "bat"
pic = "pi -c"
pir = "pi -r"
pisock = "pinvim"
pis = "pinvim"
up = "cd $HOME/.dotfiles && mise run up"

[dotfiles]
# "~/.config" = "~/.dotfiles/mise/config"

# -- pi coding agent: managed subset of ~/.pi/agent; runtime state (sessions/,
#    npm/, auth.json, settings.json) stays unmanaged. settings.json is merged
#    by `mise run pi:update`, not linked. --
"~/.pi/agent/AGENTS.md" = "~/.dotfiles/mise/config/pi-coding-agent/agent/AGENTS.md"
"~/.pi/agent/APPEND_SYSTEM.md" = "~/.dotfiles/mise/config/pi-coding-agent/agent/APPEND_SYSTEM.md"
"~/.pi/agent/keybindings.json" = "~/.dotfiles/mise/config/pi-coding-agent/agent/keybindings.json"
"~/.pi/agent/models.json" = "~/.dotfiles/mise/config/pi-coding-agent/agent/models.json"
"~/.pi/agent/mcp.json" = "~/.dotfiles/mise/config/pi-coding-agent/agent/mcp.json"
"~/.pi/web-search.json" = "~/.dotfiles/mise/config/pi-coding-agent/web-search.json"
"~/.pi/agent/web-search.json" = "~/.dotfiles/mise/config/pi-coding-agent/web-search.json"
"~/.config/pi/web-search.json" = "~/.dotfiles/mise/config/pi-coding-agent/web-search.json"
"~/.pi/agent/extensions" = { source = "~/.dotfiles/mise/config/pi-coding-agent/agent/extensions", mode = "symlink-each" }
"~/.pi/agent/skills" = { source = "~/.dotfiles/mise/config/pi-coding-agent/agent/skills", mode = "symlink-each" }
"~/.pi/agent/prompts" = { source = "~/.dotfiles/mise/config/pi-coding-agent/agent/prompts", mode = "symlink-each" }
"~/.pi/agent/agents" = { source = "~/.dotfiles/mise/config/pi-coding-agent/agent/agents", mode = "symlink-each" }
"~/.local/bin/pi" = "~/.dotfiles/mise/config/pi-coding-agent/bin/pi"
"~/.local/bin/pinvim" = "~/.dotfiles/mise/config/pi-coding-agent/bin/pinvim"
"~/.local/bin/p" = "~/.dotfiles/mise/config/pi-coding-agent/bin/p"
"~/.local/bin/pview" = "~/.dotfiles/mise/config/pi-coding-agent/bin/pview"
"~/.local/bin/work-tickets" = "~/.dotfiles/mise/config/pi-coding-agent/bin/work-tickets"
# "~/Library/Developer/Xcode/UserData/FontAndColorThemes/tokyo-night.xccolortheme" = ".config/xcode/tokyo-night.xccolortheme"
"~/.config/mise/config.toml" = "~/.dotfiles/mise/config/mise/global_config.toml"
"~/.config/atuin/config.toml" = "~/.dotfiles/mise/config/atuin/config.toml"
"~/.config/fnox/config.toml" = "~/.dotfiles/mise/config/fnox/config.toml"
"~/.config/fish" = "~/.dotfiles/mise/config/fish"
"~/.profile" = "~/.dotfiles/mise/config/bash/profile"
"~/.bashrc" = "~/.dotfiles/mise/config/bash/bashrc"
"~/.bash_profile" = "~/.dotfiles/mise/config/bash/bash_profile"
"~/.zshrc" = "~/.dotfiles/mise/config/zsh/zshrc"
"~/.zprofile" = "~/.dotfiles/mise/config/zsh/zprofile"
"~/.config/fzf" = "~/.dotfiles/mise/config/fzf"
"~/.config/jj/config.toml" = "~/.dotfiles/mise/config/jj/config.toml"
# worktrunk: per-file — approvals.toml{,.lock} in the same dir are mutable runtime state
"~/.config/worktrunk/config.toml" = "~/.dotfiles/mise/config/worktrunk/config.toml"
"~/.config/surfingkeys/config.js" = "~/.dotfiles/mise/config/surfingkeys/config.js"
"~/.config/ghostty" = "~/.dotfiles/mise/config/ghostty"
"~/.config/hammerspoon" = "~/.dotfiles/mise/config/hammerspoon"
"~/.config/kitty" = "~/.dotfiles/mise/config/kitty"
"~/.config/nvim" = "~/.dotfiles/mise/config/nvim"
"~/.config/tmux" = "~/.dotfiles/mise/config/tmux"
# "~/.config/syncthing" = "~/.dotfiles/mise/config/syncthing"

# -- generated fragments → committed static files (replaces Home Manager Nix interpolation) --
"~/.local/share/hammerspoon/nix_path.lua" = "~/.dotfiles/mise/fragments/hammerspoon/nix_path.lua"
# "~/.local/share/hammerspoon/fragments/shade-next.lua" = "~/.dotfiles/mise/fragments/hammerspoon/shade-next.lua"
# "~/.local/share/tmux/nix.conf" = "~/.dotfiles/mise/fragments/tmux/nix.conf"
# Mirror of the nix-generated shade-next config (home/common/programs/shade-next).
# Keep mise/config/shade-next/config.toml in sync with the nix module output;
# uncomment when mise (not Home Manager) owns ~/.config/shade-next.
# "~/.config/shade-next/config.toml" = "~/.dotfiles/mise/config/shade-next/config.toml"
"~/.config/sesame/config.jsonc" = { source = "~/.dotfiles/mise/fragments/sesame/config.jsonc", mode = "template" }
# "~/.config/process-compose/shortcuts.yaml" = "~/.dotfiles/mise/fragments/process-compose/shortcuts.yaml"
# "~/.config/process-compose/theme.yaml" = "~/.dotfiles/mise/fragments/process-compose/theme.yaml"

# -- kanata: individual .kbd files (parent dir has mutable state; active kanata.kbd is mutable) --
"~/.config/kanata/macbook.kbd" = "~/.dotfiles/config/kanata/macbook.kbd"
"~/.config/kanata/macbook-disabled.kbd" = "~/.dotfiles/config/kanata/macbook-disabled.kbd"
"~/.config/kanata/icons" = "~/.dotfiles/config/kanata/icons"

# -- SSH: individual files (directory holds mutable keys/known_hosts) --
"~/.ssh/config" = "~/.dotfiles/config/ssh/config"
"~/.ssh/allowed_signers" = "~/.dotfiles/mise/config/ssh/allowed_signers"
# 1Password SSH agent key selection (vault/item); GUI (cask) + CLI (formula)
# both come from brew via [bootstrap.packages], replacing nix-darwin's
# _1password module.
"~/.config/1Password/ssh/agent.toml" = "~/.dotfiles/mise/config/1password/agent.toml"
# YubiKey age identity stub (non-secret; key material stays on the YubiKey).
# Written by `mise run setup:yubikey`; used by the fnox age provider.
"~/.config/fnox/yubikey-identity.txt" = "~/.dotfiles/mise/config/fnox/yubikey-identity.txt"

# -- espanso: app support path, not XDG config (validated repo-final link chain) --
"~/Library/Application Support/espanso" = "~/.dotfiles/config/espanso"

# -- git: XDG-native; single merged config, ignore is git's default excludes path.
#    No ~/.gitconfig or ~/.gitignore in the mise world (HM-era split collapsed).
#    NOTE: while nix still owns ~/.gitconfig it wins per-key over the XDG file;
#    values are identical today — mirror edits until the HM git module is dropped. --
"~/.config/git/config" = "~/.dotfiles/mise/config/git/config"
"~/.config/git/ignore" = "~/.dotfiles/mise/config/git/ignore"
"~/.ignore" = "~/.dotfiles/mise/config/git/tool-ignore"

# -- static tool configs (small, single-file configs previously Nix-store-backed) --
"~/.config/bat/config" = "~/.dotfiles/mise/config/bat/config"
# bat theme/syntax referenced by config (--theme=everforest, ghostty map-syntax);
# run `bat cache --build` if these change
"~/.config/bat/themes/everforest.tmTheme" = "~/.dotfiles/mise/config/bat/themes/everforest.tmTheme"
"~/.config/bat/syntaxes/ghostty.sublime-syntax" = "~/.dotfiles/mise/config/bat/syntaxes/ghostty.sublime-syntax"
"~/.config/direnv/direnv.toml" = "~/.dotfiles/mise/config/direnv/direnv.toml"
"~/.config/starship.toml" = "~/.dotfiles/mise/config/starship/starship.toml"
"~/.config/karabiner/karabiner.json" = "~/.dotfiles/mise/config/karabiner/karabiner.json"
"~/.config/eza/theme.yml" = "~/.dotfiles/mise/config/eza/theme.yml"
"~/.config/ripgrep/rc" = "~/.dotfiles/mise/config/ripgrep/rc"
"~/.config/ripgrep/ignore" = "~/.dotfiles/mise/config/fd/ignore"
"~/.config/fd/ignore" = "~/.dotfiles/mise/config/fd/ignore"

# -- symlink-each targets (existing mutable dirs, needs per-entry reconciliation) --
"~/.local/bin" = { source = "~/.dotfiles/bin", mode = "symlink-each" }
"~/bin" = { source = "~/.dotfiles/bin", mode = "symlink-each" }

