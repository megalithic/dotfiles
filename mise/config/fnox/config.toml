#:schema https://fnox.jdx.dev/schema.json
# Global fnox config — linked to ~/.config/fnox/config.toml by the mise
# dotfiles table (mise/config/mise/global_config.toml). Non-nix twin of home/common/programs/opnix.
#
# Auth: op CLI with 1Password desktop-app integration (biometric); no
# service-account token needed on this machine. For headless/CI use, bootstrap
# OP_SERVICE_ACCOUNT_TOKEN with an age provider per
# https://fnox.jdx.dev/providers/1password.html.

[providers]
# account pins the personal 1Password account so machines signed into a
# work account too (e.g. workbookpro) still resolve the Crypt vault. Requires
# the personal account added to that machine's 1Password app + CLI integration.
onepass = { type = "1password", vault = "Crypt", account = "my.1password.com" }
op = { type = "1password", vault = "Crypt", account = "my.1password.com" }
# Hardware-backed bootstrap: OP_SERVICE_ACCOUNT_TOKEN is encrypted to the
# YubiKey fleet (age-plugin-yubikey, PIV retired slots). Decrypt needs one of
# the physical keys (+ touch; PIN policy varies per key). Recipients/identities
# are managed by `mise run setup:yubikey`; per-serial stubs live next to this
# file as yubikey-identity-<serial>.txt and the combined key_file below holds
# one identity line per key so any connected fleet member can decrypt.
#   15759055 = primary YK5C NFC (fnox-crypt, slot 1, pin never/touch cached)
#   15759652 = old YK5C NFC (PIV PIN blocked — recovery pending; kept for later)
age = { type = "age", recipients = [
  "age1yubikey1qdmklmqtg0m9c4xthspkq4clgc6caguc8q2ksp6pcl3c93gypt827pl4p0l", # 15759055
  "age1yubikey1qwdz7x6tcen507a08ddql7cuvv9lxce8phcxhpka5wp2llqye9q8wp825aw", # 15759652
], key_file = "~/.config/fnox/yubikey-identity.txt" }

[daemon]
enabled = true
idle_timeout = "8h"

[secrets]
# Migrated env vars: one 1Password field reference per exported name. Aliases
# intentionally share references so each underlying credential rotates once.
MEGA_ANTHROPIC_API_KEY = { provider = "onepass", value = "op://Crypt/anthropic/mega" }
WORK_ANTHROPIC_API_KEY = { provider = "onepass", value = "op://Crypt/anthropic/work" }
