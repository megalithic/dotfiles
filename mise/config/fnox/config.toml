MISE_GITHUB_API_TOKEN = { provider = "onepass", value = "op://Crypt/github/token" }
GITHUB_CLI_TOKEN = { provider = "onepass", value = "op://Crypt/github/cli_token" }

# Legacy env and s3cfg 1Password blob items are intentionally not referenced;
# retain the items only through their clean cutover verification periods.
# The YubiKey-backed service-account token remains an on-demand fnox secret.
OP_SERVICE_ACCOUNT_TOKEN = { provider = "age", value = "", env = false }

# On-demand single values: `fnox get APPLE_TEAM_ID`. env = false so shell
# activation doesn't hit 1Password on every new shell for rarely-used secrets.
APPLE_ID_EMAIL = { provider = "onepass", value = "op://Crypt/apple-developer/username", env = false }
APPLE_TEAM_ID = { provider = "onepass", value = "op://Crypt/apple-developer/Section_6qgogrdycnlqc4x7ngqwchlyvi/team id", env = false }
APPLE_NOTARYTOOL_PASSWORD = { provider = "onepass", value = "op://Crypt/apple-developer/Section_6qgogrdycnlqc4x7ngqwchlyvi/notarytool app password", env = false }

COZI_USERNAME = { provider = "onepass", value = "op://Crypt/tsfx5wfd3kzuauzl5h4m3dct5i/COZI_USERNAME", env = false }
COZI_PASSWORD = { provider = "onepass", value = "op://Crypt/tsfx5wfd3kzuauzl5h4m3dct5i/COZI_PASSWORD", env = false }
