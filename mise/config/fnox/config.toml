WORK_CLAUDE_CODE_OAUTH_TOKEN = { provider = "onepass", value = "op://Crypt/claude-code/work" }
CLAUDE_CODE_OAUTH_TOKEN = { provider = "onepass", value = "op://Crypt/claude-code/work" }
OPENCODE_GENERAL_GEMINI_API_KEY = { provider = "onepass", value = "op://Crypt/gemini/opencode_general" }
EVIRTS_GEMINI_API_KEY = { provider = "onepass", value = "op://Crypt/gemini/evirts" }
